<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>라디오 신청 - PL-TUB-RA</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --top: #ffdde1; --btm: #ee9ca7; --glass: rgba(255,255,255,0.4); --text: #7d5a5a; --accent: #ee9ca7; }
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, var(--top), var(--btm)); margin: 0; padding: 20px; min-height: 100vh; color: var(--text); background-attachment: fixed; }
        
        .container { width: 100%; max-width: 480px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; cursor: pointer; }
        .logo { font-size: 24px; font-weight: 900; color: white; }

        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.3); }
        .input-box { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid var(--glass); background: white; outline: none; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        
        .admin-only { display: none; }
        .handle { cursor: grab; background: rgba(0,0,0,0.05); text-align: center; border-radius: 8px; font-size: 10px; padding: 4px; margin-bottom: 8px; display: none; }

        .card { background: rgba(255,255,255,0.6); border-radius: 22px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--glass); }
        .card-title { font-size: 15px; font-weight: 800; margin-bottom: 5px; }
        .card-info { font-size: 12px; opacity: 0.8; margin-bottom: 12px; }
        
        .copy-btn { width: 100%; background: white; color: var(--text); border: none; padding: 12px; border-radius: 15px; font-weight: 800; cursor: pointer; margin-bottom: 8px; font-size: 13px; }
        .go-btn { display: block; width: 100%; background: var(--accent); color: white; text-align: center; text-decoration: none; padding: 12px; border-radius: 15px; font-weight: 800; font-size: 13px; box-sizing: border-box; }
        
        .back-btn { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <a href="../index.html" class="back-btn">⇠ 돌아가기</a>
    <header onclick="askAdmin()"><div class="logo">RADIO STATION</div></header>

    <div id="adminPanel" class="glass-panel admin-only">
        <input type="text" id="regTitle" class="input-box" placeholder="📻 방송 프로그램 제목">
        <input type="text" id="regLink" class="input-box" placeholder="🔗 신청 폼/게시판 링크">
        <input type="text" id="regDj" class="input-box" placeholder="👤 DJ태그 (예: @plave_official)">
        <input type="text" id="regHash" class="input-box" placeholder="# 해시태그 (예: #노아의초콜릿박스)">
        <select id="regStation" class="input-box">
            <option value="W">W (유튜브/위버스)</option>
            <option value="M">M (MBC 라디오)</option>
        </select>
        <button onclick="submitRadio()" id="subBtn" class="go-btn" style="width:100%; border:none;">라디오 등록하기</button>
        <button onclick="saveOrder()" class="copy-btn" style="margin-top:10px;">↕ 순서 저장하기</button>
    </div>

    <div id="grid"></div>
</div>

<script>
    const API_KEY = "수희님의_API_KEY";
    const SHEET_ID = "수희님의_SHEET_ID";
    const GAS_URL = "수희님의_GAS_배포_URL";
    
    let cachedData = [], isAdmin = false;

    function askAdmin() {
        if(prompt("관리자 비밀번호를 입력하세요.") === "0312") {
            isAdmin = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            renderCards();
        }
    }

    async function fetchData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/radio!A2:M?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            cachedData = r.values || [];
            renderCards();
        } catch(e) { console.error("라디오 로드 실패"); }
    }

    function renderCards() {
        const g = document.getElementById('grid'); g.innerHTML = '';
        const displayData = isAdmin ? cachedData : [...cachedData].reverse();

        displayData.forEach((row, idx) => {
            const [date, link, cat, tag, title, start, deadline, img, dj, hash, song, station] = row;
            const realIdx = isAdmin ? idx : cachedData.length - 1 - idx;

            const c = document.createElement('div');
            c.className = 'card';
            c.setAttribute('data-idx', realIdx);
            c.innerHTML = `
                ${isAdmin ? `<div class="handle" style="display:block;">⠿ 드래그하여 이동</div>` : ''}
                <div class="card-title">${title}</div>
                <div class="card-info">${dj || ''} ${hash || ''}</div>
                <button class="copy-btn" onclick="copyText('${dj}','${hash}','${station}')">📋 사연 문구 복사</button>
                <a href="${link}" target="_blank" class="go-btn">신청하러 가기</a>
            `;
            g.appendChild(c);
        });
    }

    // 문구 복사 로직 (DJ태그 + 해시태그 조합)
    function copyText(dj, hash, station) {
        let ment = "";
        if(station === 'M') {
            ment = `[사연신청] ${dj} ${hash} 오늘도 좋은 노래 들려주세요!`;
        } else {
            ment = `${dj} ${hash} 플레이브 노래 신청합니다! 💙💜💗❤️🖤`;
        }
        
        navigator.clipboard.writeText(ment).then(() => {
            alert("문구가 복사되었습니다! ✨\n\n" + ment);
        });
    }

    async function saveOrder() {
        const cards = document.querySelectorAll('.card');
        const newOrderedData = Array.from(cards).map(c => cachedData[c.getAttribute('data-idx')]);
        const res = await fetch(GAS_URL, { 
            method: "POST", 
            body: JSON.stringify({ action: "updateOrder", sheetName: "radio", orderedData: newOrderedData }) 
        });
        if((await res.json()).result === "success") alert("라디오 순서 저장 완료!");
    }

    async function submitRadio() {
        const payload = {
            sheetName: "radio",
            url: document.getElementById('regLink').value,
            userTitle: document.getElementById('regTitle').value,
            djTag: document.getElementById('regDj').value,
            hashtags: document.getElementById('regHash').value,
            stationCode: document.getElementById('regStation').value,
            category: "라디오", tag: "RADIO"
        };
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        if((await res.json()).result === "success") { alert("라디오 등록 완료!"); location.reload(); }
    }

    window.onload = fetchData;
    Sortable.create(document.getElementById('grid'), { handle: '.handle', animation: 150 });
</script>
</body>
</html>
