<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLLI-TUB-RA | 라디오 신청</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --top: #c5c9f4; --btm: #fbc2eb; --glass: rgba(255,255,255,0.4); --text: #4b4b7c; --accent: #7d93eb; }
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, var(--top), var(--btm)); margin: 0; padding: 20px; min-height: 100vh; color: var(--text); background-attachment: fixed; }
        
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .container { width: 100%; max-width: 480px; margin: 0 auto; transition: 0.3s; }
        header { text-align: center; padding: 20px 0; cursor: pointer; }
        .logo { font-size: 24px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .back-btn { display: inline-block; margin-bottom: 20px; color: white; text-decoration: none; font-weight: bold; font-size: 14px; opacity: 0.8; }

        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.3); }
        .input-box { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid var(--glass); background: white; outline: none; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        
        .admin-only { display: none; }

        /* 앨범/태그 그룹화 스타일 */
        .album-group { background: rgba(255,255,255,0.15); border-radius: 25px; padding: 15px; margin-bottom: 25px; }
        .album-title { font-size: 17px; font-weight: 900; margin-bottom: 15px; color: white; padding-left: 10px; border-left: 4px solid var(--accent); }
        
        /* 라디오 카드 가로형 컴팩트 디자인 */
        .radio-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .radio-card { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.6); padding: 12px 18px; border-radius: 18px; border: 1px solid var(--glass); }
        .radio-info { flex: 1; }
        .radio-title { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
        .radio-tags { font-size: 11px; opacity: 0.6; }
        .radio-btns { display: flex; gap: 6px; }
        .copy-btn, .go-link { padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; cursor: pointer; text-decoration: none; border: none; }
        .copy-btn { background: white; color: var(--text); }
        .go-link { background: var(--accent); color: white; }

        /* PC 레이아웃 (1024px 이상) */
        @media (min-width: 1024px) {
            .container { max-width: 1200px; }
            #mainLayout { display: flex; gap: 25px; align-items: start; }
            #gridContainer { flex: 1; }
            .sidebar { width: 320px; position: sticky; top: 20px; }
            .radio-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <a href="../index.html" class="back-btn">⇠ 메인으로 돌아가기</a>
    <header onclick="askAdmin()"><div class="logo">RADIO STATION</div></header>

    <div id="adminPanel" class="glass-panel admin-only">
        <input type="text" id="regTitle" class="input-box" placeholder="📻 방송 프로그램 제목">
        <input type="text" id="regLink" class="input-box" placeholder="🔗 신청 폼/게시판 링크">
        <input type="text" id="regTagCode" class="input-box" placeholder="🏷️ 태그코드 (D열 - 묶음기준)">
        <input type="text" id="regDj" class="input-box" placeholder="👤 DJ 인사말/태그">
        <input type="text" id="regHash" class="input-box" placeholder="# 해시태그">
        <input type="text" id="regExtra" class="input-box" placeholder="🔗 스포티파이, 유튜브 링크">
        <select id="regStation" class="input-box">
            <option value="HALLYU">HALLYU (영어/스포티파이)</option>
            <option value="TOCA">TOCA (포르투갈어)</option>
            <option value="GV">GV (DJ Clyde)</option>
            <option value="URBANA">URBANA (스페인어)</option>
            <option value="WPVR">WPVR (DJ Kevin)</option>
            <option value="M">M (국내 MBC 등)</option>
        </select>
        <button onclick="submitRadio()" class="go-link" style="width:100%; padding:15px; font-size:14px; border:none;">라디오 등록하기</button>
    </div>

    <div id="mainLayout">
        <div id="gridContainer">
            <div id="grid"></div>
        </div>

        <div class="sidebar">
            <div class="glass-panel">
                <div style="font-weight: 900; margin-bottom: 10px;">📢 RADIO NOTICE</div>
                <div id="noticeDisplay" style="font-size: 12px; line-height: 1.6; opacity: 0.9;">
                    공지사항을 불러오는 중...
                </div>
            </div>
            <div class="glass-panel" style="height: 400px; display: flex; flex-direction: column;">
                <div style="font-weight: 900; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span>💬 플리 대기실</span>
                    <button onclick="changeNick()" style="font-size:10px; border:none; background:none; color:var(--accent); cursor:pointer;">(변경)</button>
                </div>
                <div id="chatMessages" style="flex:1; overflow-y:auto; background:rgba(255,255,255,0.3); border-radius:15px; padding:10px; font-size:12px; margin-bottom:10px;"></div>
                <input type="text" id="chatInput" class="input-box" style="margin-bottom:0;" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendChat()">
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZQL2iDN220bBdU0xiYDShqLRRp6AQJDI",
        authDomain: "chat-9035a.firebaseapp.com",
        databaseURL: "https://chat-9035a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "chat-9035a",
        storageBucket: "chat-9035a.firebasestorage.app",
        messagingSenderId: "807179401789",
        appId: "1:807179401789:web:644359473a0cb1e05f4854",
        measurementId: "G-BKQNKVRB8X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    let myNick = localStorage.getItem('chatNickname');
    if (!myNick) {
        myNick = prompt("사용하실 닉네임을 입력해주세요!", "익명플리");
        if (!myNick || myNick.trim() === "") myNick = "익명플리";
        myNick = myNick.substring(0, 8);
        localStorage.setItem('chatNickname', myNick);
    }

    window.changeNick = function() {
        const newNick = prompt("새로운 닉네임을 입력하세요.");
        if (newNick && newNick.trim() !== "") {
            localStorage.setItem('chatNickname', newNick.substring(0, 8));
            location.reload();
        }
    };

    window.sendChat = function() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        push(chatRef, {
            nick: myNick,
            msg: msg,
            time: Date.now()
        });
        input.value = '';
    };

    onChildAdded(chatRef, (data) => {
        const chat = data.val();
        const chatMessages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        div.style.fontSize = "13px";
        
        const isMe = chat.nick === myNick;
        const nickColor = isMe ? "var(--accent)" : "#555";
        const nickFont = isMe ? "900" : "700";

        div.innerHTML = `<span style="color:${nickColor}; font-weight:${nickFont};">[${chat.nick}]</span> ${chat.msg}`;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });
</script>

<script>
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwsaZ9xNvPdZENLmjS-V0sWy22ItvR43YAr3b1K2qTkHrfjUgSedbqnAVpQ2hdc040T/exec";
    
    let cachedData = [], isAdmin = false;

    function askAdmin() {
        if(prompt("관리자 비밀번호를 입력하세요.") === "0312") {
            isAdmin = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            renderCards();
        }
    }

    async function fetchData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/radio!A2:N?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            cachedData = r.values || [];
            renderCards();
        } catch(e) { console.error("데이터 로드 실패"); }
    }

    function renderCards() {
        const g = document.getElementById('grid'); g.innerHTML = '';
        const groups = {};
        
        cachedData.forEach((row, idx) => {
            const tagCode = row[3] || "ETC"; 
            if (!groups[tagCode]) groups[tagCode] = [];
            groups[tagCode].push({ row, idx });
        });

        for (const code in groups) {
            const albumDiv = document.createElement('div');
            albumDiv.className = 'album-group';
            albumDiv.innerHTML = `<div class="album-title">💿 ${code}</div>`;
            const radioGrid = document.createElement('div');
            radioGrid.className = 'radio-grid';
            
            groups[code].forEach(item => {
                const [date, link, cat, tag, title, start, deadline, img, dj, hash, extra, station] = item.row;
                
                // --- 🆕 플랫폼 아이콘 판별 로직 추가 ---
                let platformBadge = "";
                if (extra) {
                    if (extra.includes("spotify")) {
                        platformBadge = `<span style="background:#1DB954; color:white; padding:2px 6px; border-radius:4px; font-size:9px; margin-right:5px; vertical-align:middle;">SPOTIFY</span>`;
                    } else if (extra.includes("youtu")) {
                        platformBadge = `<span style="background:#FF0000; color:white; padding:2px 6px; border-radius:4px; font-size:9px; margin-right:5px; vertical-align:middle;">YOUTUBE</span>`;
                    }
                }
                // ------------------------------------

                const card = document.createElement('div');
                card.className = 'radio-card';
                card.innerHTML = `
                    <div class="radio-info">
                        <div class="radio-title">${platformBadge}${title}</div>
                        <div class="radio-tags">${dj || ''}</div>
                    </div>
                    <div class="radio-btns">
                        <button class="copy-btn" onclick="copyText('${dj}','${hash}','${station}','${title}','${extra}')">📋</button>
                        <a href="${link}" target="_blank" class="go-link">▶</a>
                    </div>
                `;
                radioGrid.appendChild(card);
            });
            albumDiv.appendChild(radioGrid);
            g.appendChild(albumDiv);
        }
    }

    function copyText(dj, hash, station, title, extraLinks) {
        let ment = "";
        const links = extraLinks ? extraLinks.split(/[\s,]+/) : ["", ""];
        const spotify = links[0] || "";
        const youtube = links[1] || "";
        const allLinks = links.filter(l => l !== "").join('\n');
        switch (station) {
            case 'HALLYU': ment = `Hi. ${dj}\n\nI would like to request ${title} by #PLAVE\nThank you so much.\n\n${spotify}`; break;
            case 'TOCA': ment = `Olá.\nGostaria de solicitar a música ${title} da #PLAVE.\nMuito obrigado.\n\n${hash}\n\n${spotify}\n${youtube}`; break;
            case 'GV': ment = `Hi, DJ Clyde!\nI'd like to request ${title} by #PLAVE.\nThank you so much.\n\n${hash}\n\n${allLinks}`; break;
            case 'URBANA': ment = `Buenos días a todos ${dj} este sábado me encantaría escuchar ${title} de PLAVE ${hash}`; break;
            case 'WPVR': ment = `Hi. DJ Kevin. ${dj}\nI'd like to request ${title} by #PLAVE\nThank you so much.\n\n${hash}\n\n${allLinks}`; break;
            case 'M': ment = `[사연신청] ${dj} ${hash} 플레이브의 ${title} 신청합니다! 오늘도 좋은 노래 부탁드려요. 💙💜💗❤️🖤\n\n${allLinks}`; break;
            default: ment = `${dj} ${hash}\nI request ${title} by PLAVE. Thank you!\n\n${allLinks}`;
        }
        navigator.clipboard.writeText(ment).then(() => { alert(`${station} 사연 복사 완료! ✨`); });
    }

    async function loadNotice() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/notice!A:A?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            const notices = r.values || [];
            document.getElementById('noticeDisplay').innerHTML = notices.map(n => `• ${n[0]}<br>`).join('');
        } catch(e) { document.getElementById('noticeDisplay').innerText = "공지가 없습니다."; }
    }

    async function submitRadio() {
        const payload = {
            sheetName: "radio",
            url: document.getElementById('regLink').value,
            userTitle: document.getElementById('regTitle').value,
            tag: document.getElementById('regTagCode').value,
            djTag: document.getElementById('regDj').value,
            hashtags: document.getElementById('regHash').value,
            extraLinks: document.getElementById('regExtra').value,
            stationCode: document.getElementById('regStation').value,
            category: "라디오"
        };
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        if((await res.json()).result === "success") { alert("라디오 등록 완료!"); location.reload(); }
    }

    window.onload = () => { fetchData(); loadNotice(); };
</script>
</body>
</html>
