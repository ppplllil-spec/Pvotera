<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>플리튭라 정보공유</title>
    <link rel="manifest" href="./manifest.json">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --top: #c5c9f4; --btm: #fbc2eb; --glass: rgba(255,255,255,0.4); --text: #4b4b7c; --accent: #7d93eb; }
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, var(--top), var(--btm)); margin: 0; padding: 20px; min-height: 100vh; color: var(--text); background-attachment: fixed; }
        .container { width: 100%; max-width: 480px; margin: 0 auto; }
        
        /* 알림 바 스타일 */
        #alertBar { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(125,147,235,0.9); color: white; padding: 12px 40px; border-radius: 30px; font-weight: 900; z-index: 1000; transition: 0.5s; backdrop-filter: blur(10px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #alertBar.show { top: 30px; }

        /* 헤더 및 검색 */
        header { text-align: center; padding-bottom: 20px; }
        .logo { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .search-box { width: 100%; padding: 12px 20px; border-radius: 20px; border: 1px solid var(--glass); background: var(--glass); backdrop-filter: blur(10px); outline: none; box-sizing: border-box; margin-bottom: 20px; font-family: inherit; }

        /* 카테고리 칩 */
        .cat-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 10px; scrollbar-width: none; }
        .chip { padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.2); border: 1px solid var(--glass); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .chip.active { background: white; color: var(--accent); }

        /* 카드 그리드 */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border-radius: 20px; padding: 12px; border: 1px solid var(--glass); position: relative; display: flex; flex-direction: column; transition: 0.3s; }
        .card.done { opacity: 0.5; filter: grayscale(0.8); }
        .card-img { width: 100%; height: 90px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; cursor: pointer; }
        .card-tag { font-size: 9px; font-weight: 800; padding: 3px 8px; border-radius: 8px; color: white; background: var(--accent); width: fit-content; margin-bottom: 6px; }
        .card-title { font-size: 13px; font-weight: 700; line-height: 1.3; margin-bottom: 5px; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card-desc { font-size: 10px; color: #666; margin-bottom: 8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; cursor: pointer; }
        .card-desc.open { -webkit-line-clamp: unset; }
        .timer { font-size: 10px; font-weight: 800; color: #ff7675; margin-bottom: 10px; }
        
        .btn-row { display: flex; gap: 5px; margin-top: auto; }
        .go-btn, .check-btn { flex: 1; border: none; padding: 8px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; transition: 0.2s; text-align: center; text-decoration: none; }
        .go-btn { background: white; color: var(--text); }
        .check-btn { background: var(--accent); color: white; }

        /* 라이트박스 */
        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:2000; padding:20px; box-sizing:border-box; }
        #modal img { max-width:100%; max-height:80%; border-radius:15px; }
    </style>
</head>
<body>

<div id="alertBar">리셋</div>
<div id="modal" onclick="this.style.display='none'"><img id="modalImg"></div>

<div class="container">
    <header><div class="logo">PL-TUB-RA</div></header>
    
    <input type="text" id="search" class="search-box" placeholder="어떤 정보를 찾으시나요?" oninput="renderCards()">

    <div class="cat-group">
        <div class="chip active" onclick="setCat(this, 'data')">🌟 전체</div>
        <div class="chip" onclick="setCat(this, 'VOTE')">🗳️ 투표</div>
        <div class="chip" onclick="setCat(this, 'streaming')">🎧 뮤밍</div>
        <div class="chip" onclick="location.href='./radio/index.html'">📻 라디오</div>
    </div>

    <div class="card-grid" id="grid"></div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbywBQMHYul3tNDcRJnMgBVICkeyR0yflkB7adCEcQAWsrXv3zU-9aLgl8YBe3mFm6xijg/exec";
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    let currentSheet = 'data';
    let cachedData = [];

    // 정각 알림 함수 (무음 "리셋")
    function checkReset() {
        const now = new Date();
        if (now.getMinutes() === 0 && now.getSeconds() === 0) {
            const bar = document.getElementById('alertBar');
            bar.classList.add('show');
            setTimeout(() => bar.classList.remove('show'), 5000);
        }
    }
    setInterval(checkReset, 1000);

    async function fetchData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${currentSheet}!A2:M?key=${API_KEY}`;
        try {
            const res = await fetch(url).then(r => r.json());
            cachedData = res.values || [];
            renderCards();
        } catch (e) { console.error(e); }
    }

    function setCat(btn, sheet) {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        currentSheet = (sheet === 'VOTE') ? 'data' : sheet;
        fetchData();
    }

    function toggleCheck(id, btn) {
        const card = btn.closest('.card');
        card.classList.toggle('done');
        const isDone = card.classList.contains('done');
        localStorage.setItem(`check_${id}`, isDone);
        btn.innerText = isDone ? "완료 ✅" : "체크";
    }

    function renderCards() {
        const query = document.getElementById('search').value.toLowerCase();
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        cachedData.reverse().forEach((row, idx) => {
            const [date, link, cat, tag, title, desc, deadline, img, dj, hash, extra, st, best] = row;
            if (query && !title.toLowerCase().includes(query)) return;

            const id = date + idx;
            const isDone = localStorage.getItem(`check_${id}`) === 'true';
            
            const card = document.createElement('div');
            card.className = `card ${isDone ? 'done' : ''}`;
            
            // 카운트다운 로직
            let timerHtml = '';
            if (deadline) {
                const end = new Date(deadline);
                const diff = end - new Date();
                if (diff > 0 && diff < 86400000) {
                    const h = String(Math.floor(diff/3600000)).padStart(2,'0');
                    const m = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
                    const s = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
                    timerHtml = `<div class="timer">⏰ ${h}:${m}:${s} 남음</div>`;
                }
            }

            card.innerHTML = `
                ${img ? `<img src="${img}" class="card-img" onclick="showImg('${img}')">` : ''}
                <div class="card-tag">${tag || 'INFO'}</div>
                <div class="card-title">${title}</div>
                <div class="card-desc" onclick="this.classList.toggle('open')">${desc || ''}</div>
                ${timerHtml}
                <div class="btn-row">
                    <a href="${link}" target="_blank" class="go-btn">이동</a>
                    <button class="check-btn" onclick="toggleCheck('${id}', this)">${isDone ? '완료 ✅' : '체크'}</button>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function showImg(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('modal').style.display = 'flex';
    }

    window.onload = fetchData;
    setInterval(renderCards, 1000); // 1초마다 타이머 갱신
</script>
</body>
</html>
