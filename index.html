<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>플리튭라정보</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --top: #c5c9f4; --btm: #fbc2eb; --glass: rgba(255,255,255,0.4); --text: #4b4b7c; --accent: #7d93eb; }
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, var(--top), var(--btm)); margin: 0; padding: 20px; min-height: 100vh; color: var(--text); background-attachment: fixed; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        #alertBar { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: rgba(125,147,235,0.9); color: white; padding: 10px 30px; border-radius: 30px; font-weight: 900; z-index: 3000; transition: 0.5s; backdrop-filter: blur(10px); }
        #alertBar.show { top: 30px; }

        .container { width: 100%; max-width: 480px; margin: 0 auto; transition: 0.3s; }
        header { text-align: center; padding: 20px 0; cursor: pointer; }
        .logo { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.3); }
        .input-box { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid var(--glass); background: white; outline: none; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        
        .admin-only { display: none; }
        .cat-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; }
        .chip { padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.2); border: 1px solid var(--glass); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .chip.active { background: white; color: var(--accent); }

        /* 카드 그리드 */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border-radius: 22px; padding: 12px; border: 1px solid var(--glass); display: flex; flex-direction: column; transition: 0.3s; position: relative; }
        .card.done { opacity: 0.5; filter: grayscale(0.8); }
        .card-img { width: 100%; height: 95px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; cursor: pointer; }
        .card-title { font-size: 13px; font-weight: 800; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .btn-row { display: flex; gap: 5px; margin-top: auto; }
        .go-btn, .check-btn { flex: 1; border: none; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; }
        .go-btn { background: white; color: var(--text); }
        .check-btn { background: var(--accent); color: white; }

        /* 파일 업로드 버튼 */
        .file-label { display: block; background: white; color: var(--text); padding: 12px; border-radius: 15px; border: 1px solid var(--glass); font-size: 14px; font-weight: 700; text-align: center; cursor: pointer; margin-bottom: 10px; }
        #regFile { display: none; }
/* 나만의 뮤밍 빌더 그리드 설정 (PC) */
#builderGrid {
    display: grid;
    grid-template-columns: 1fr; /* 모바일은 한 줄 */
    gap: 10px;
    max-height: 400px; /* 너무 길어지면 내부 스크롤 */
    overflow-y: auto;
    padding: 5px;
}
/* 드래그 중일 때 글자가 선택되지 않도록 방지 */
.card, .builder-item {
    user-select: none; 
}
        
@media (min-width: 768px) {
    #builderGrid {
        grid-template-columns: repeat(2, 1fr); /* PC에서는 두 줄로 나열 */
    }
}

.builder-item {
    background: white;
    padding: 10px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--glass);
    transition: 0.2s;
}

.builder-item:hover {
    border-color: var(--accent);
}
        /* 1. 드래그 중인 원래 위치에 남은 잔상 (투명하게) */
.sortable-ghost {
    opacity: 0.3 !important;
    background: var(--accent) !important;
    border: 2px dashed white !important;
}

/* 2. 마우스를 따라다니는 실제 카드 (살짝 커지고 그림자) */
.sortable-chosen {
    cursor: grabbing !important;
    box-shadow: 0 10px 20px rgba(0,0,0,0.2) !important;
    transform: scale(1.02);
    transition: transform 0.2s ease;
}

/* 드래그 가능함을 알리는 핸들 효과 */
.handle:hover, .v-drag-handle:hover {
    color: white !important;
    background: var(--accent);
    border-radius: 5px;
}
        /* PC 레이아웃 (1024px 이상) */
        @media (min-width: 1024px) {
            .container { max-width: 1200px; }
            #mainLayout { display: flex; gap: 25px; align-items: start; }
            #gridContainer { flex: 1; }
            .sidebar { width: 320px; position: sticky; top: 20px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        }

        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:4000; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 15px; }
    </style>
</head>
<body>

<div id="alertBar">리셋</div>
<div id="modal" onclick="this.style.display='none'"><img id="modalImg"></div>

<div class="container">
    <header onclick="askAdmin()"><div class="logo">플리정보공간</div></header>

    <div id="adminNoticePanel" class="glass-panel admin-only">
        <div style="font-weight: 900; margin-bottom: 15px; color: var(--text);">📢 실시간 공지사항 수정</div>
        <textarea id="noticeInput" class="input-box" style="height: 100px; resize: none;" placeholder="한 줄에 하나씩 공지내용을 적어주세요."></textarea>
        <button onclick="saveNotice()" id="noticeBtn" class="check-btn" style="width:100%; padding:12px;">공지사항 즉시 저장</button>
    </div>

    <div id="registrationPanel" class="glass-panel">
        <div style="font-weight: 900; margin-bottom: 15px; color: var(--text);">🗳️ 정보 제보 및 등록</div>
        <select id="sheetSelect" class="input-box">
            <option value="data">🗳️ 투표/정보 (data)</option>
        </select>
        <input type="text" id="regLink" class="input-box" placeholder="🔗 링크 주소">
        <input type="text" id="regTitle" class="input-box" placeholder="📝 제목">
        <input type="datetime-local" id="regDeadline" class="input-box">
        
        <label for="regFile" class="file-label">🖼️ 리스트 이미지 선택 (선택)</label>
        <input type="file" id="regFile" accept="image/*" onchange="updateFileName(this)">
        <span id="fileNameDisplay" style="font-size:11px; color:var(--accent); display:block; text-align:center; margin-bottom:10px;">선택된 파일 없음</span>
        
        <button onclick="submitData()" id="subBtn" class="check-btn" style="width:100%; padding:15px; font-size:14px;">등록하기</button>
        <button onclick="saveOrder()" class="go-btn admin-only" style="width:100%; margin-top:10px; border:1px solid var(--accent);">↕ 순서 저장하기 (관리자)</button>
    </div>

    <input type="text" id="search" class="input-box search-box" placeholder="검색어를 입력하세요..." oninput="renderCards()">

    <div class="cat-group">
        <div class="chip active" onclick="setCat(this, 'data')">🌟 전체</div>
        <div class="chip" onclick="setCat(this, 'streaming')">🎧 뮤밍</div>
        <div class="chip" onclick="location.href='./radio/index.html'">📻 라디오</div>
    </div>

    <div id="mainLayout">
        <div id="gridContainer">
            <div class="card-grid" id="grid"></div>
            
            <div class="glass-panel" style="margin-top: 40px; border: 2px solid var(--accent);">
                <div style="font-weight: 900; margin-bottom: 15px; color: var(--text); display: flex; justify-content: space-between; align-items: center;">
                    <span>🎧 나만의 실시간 뮤밍리스트</span>
                    <div id="totalTimeDisplay" style="background: var(--accent); color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px;">총 0분 0초</div>
                </div>
                <div id="quickBtns" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px;"></div>
                <div id="builderGrid" style="min-height: 50px;"></div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button onclick="playBuilderList()" class="check-btn" style="flex: 1; background: #555;">▶ 전체 순서대로 재생</button>
                    <button onclick="clearBuilder()" class="go-btn" style="flex: 0.4; border: 1px solid #ddd;">전체 삭제</button>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div class="glass-panel">
                <div style="font-weight: 900; margin-bottom: 10px;">📢 NOTICE</div>
                <div id="noticeDisplay" style="font-size: 12px; line-height: 1.6; opacity: 0.9;"></div>
            </div>
            <div class="glass-panel" style="height: 450px; display: flex; flex-direction: column;">
                <div style="font-weight: 900; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span>💬 플리 대기실</span>
                    <button onclick="changeNick()" style="font-size:10px; border:none; background:none; color:var(--accent); cursor:pointer;">(변경)</button>
                </div>
                <div id="chatMessages" style="flex:1; overflow-y:auto; background:rgba(255,255,255,0.3); border-radius:15px; padding:10px; font-size:12px; margin-bottom:10px;"></div>
                <input type="text" id="chatInput" class="input-box" style="margin-bottom:0;" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendChat()">
            </div>
        </div>
    </div>
</div>

<script type="module">
    // Firebase SDK 및 함수 임포트
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // ⚠️ Firebase 설정값을 여기에 정확히 붙여넣으세요!
    const firebaseConfig = {
        apiKey: "...",
        authDomain: "...",
        databaseURL: "...",
        projectId: "...",
        storageBucket: "...",
        messagingSenderId: "...",
        appId: "..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    // 닉네임 관리 로직
    let myNick = localStorage.getItem('chatNickname');
    if (!myNick) {
        myNick = prompt("사용하실 닉네임을 입력해주세요! (최대 8자)", "익명플리");
        if (!myNick || myNick.trim() === "") myNick = "익명플리";
        myNick = myNick.substring(0, 8);
        localStorage.setItem('chatNickname', myNick);
    }

    // 닉네임 변경 함수 (전역 등록)
    window.changeNick = function() {
        const newNick = prompt("새로운 닉네임을 입력하세요.");
        if (newNick && newNick.trim() !== "") {
            localStorage.setItem('chatNickname', newNick.substring(0, 8));
            location.reload();
        }
    };

    // 메시지 전송 함수 (전역 등록)
    window.sendChat = function() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        push(chatRef, {
            nick: myNick,
            msg: msg,
            time: Date.now()
        });
        input.value = '';
    };

    // 메시지 실시간 수신
    onChildAdded(chatRef, (data) => {
        const chat = data.val();
        const chatMessages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        div.style.fontSize = "13px";
        
        const isMe = chat.nick === myNick;
        const nickColor = isMe ? "var(--accent)" : "#555";
        const nickFont = isMe ? "900" : "700";

        div.innerHTML = `<span style="color:${nickColor}; font-weight:${nickFont};">[${chat.nick}]</span> ${chat.msg}`;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });
</script>

<script>
    // 기존 앱 로직
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwsaZ9xNvPdZENLmjS-V0sWy22ItvR43YAr3b1K2qTkHrfjUgSedbqnAVpQ2hdc040T/exec";
    
    let currentSheet = 'data', cachedData = [], isAdmin = false, tempWebP = "";
    let builderData = JSON.parse(localStorage.getItem('plaveBuilder') || '[]');

    function askAdmin() {
        if(prompt("관리자 비밀번호를 입력하세요.") === "0312") {
            isAdmin = true;
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'block');
            const currentNotices = document.getElementById('noticeDisplay').innerText.replace(/• /g, '');
            document.getElementById('noticeInput').value = currentNotices;
            renderCards();
        }
    }
// [추가] 링크 입력 시 자동으로 제목/이미지 가져오는 함수
document.getElementById('regLink').addEventListener('change', async function() {
    const url = this.value.trim();
    if (!url) return;

    const titleInput = document.getElementById('regTitle');
    const subBtn = document.getElementById('subBtn');

    // 유튜브 링크일 경우 제목 추출 시도 (서버를 통해 메타데이터 가져오기)
    try {
        subBtn.innerText = "정보 확인 중...";
        
        // GAS 서버에 메타데이터 추출 요청 (이 로직은 GAS 코드에 이미 포함되어 있습니다)
        // 화면에서 즉시 보여주고 싶다면 아래처럼 간단한 안내를 띄워줍니다.
        titleInput.placeholder = "⌛ 제목을 자동으로 가져오는 중입니다...";
        
        // 실제 작동: 등록하기를 누르면 서버(GAS)가 getMetaData를 실행해 빈 곳을 채워주지만,
        // 사용자에게 미리 보여주고 싶다면 제목 칸에 '자동 추출 예정'이라고 띄워주는 게 친절해요!
        if (titleInput.value === "") {
            titleInput.value = "자동으로 정보를 불러옵니다. (수정 가능)";
        }
    } finally {
        subBtn.innerText = "등록하기";
    }
});
    async function loadNotice() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/notice!A:A?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            const notices = r.values || [];
            document.getElementById('noticeDisplay').innerHTML = notices.map(n => `• ${n[0]}<br>`).join('');
        } catch(e) { document.getElementById('noticeDisplay').innerText = "공지사항이 없습니다."; }
    }

    async function saveNotice() {
        const btn = document.getElementById('noticeBtn');
        const text = document.getElementById('noticeInput').value.trim();
        if(!text) return alert("공지 내용을 입력하세요.");
        btn.innerText = "저장 중...";
        const noticeList = text.split('\n').map(line => [line]);
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify({ action: "updateNotice", notices: noticeList }) });
        if((await res.json()).result === "success") {
            alert("공지사항이 업데이트되었습니다!");
            loadNotice();
            btn.innerText = "공지사항 즉시 저장";
        }
    }

    async function fetchData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${currentSheet}!A2:N?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            cachedData = r.values || [];
            renderCards();
        } catch(e) { console.error("데이터 로드 실패"); }
    }

    function renderCards() {
        const q = document.getElementById('search').value.toLowerCase();
        const g = document.getElementById('grid'); g.innerHTML = '';
        const displayData = isAdmin ? cachedData : [...cachedData].reverse();
        displayData.forEach((row, idx) => {
            const [date, link, cat, tag, title, start, deadline, img] = row;
            if(q && !title.toLowerCase().includes(q)) return;
            const realIdx = isAdmin ? idx : cachedData.length - 1 - idx;
            const id = `chk_${date}_${realIdx}`;
            const isDone = localStorage.getItem(id) === 'true';
            const c = document.createElement('div');
            c.className = `card ${isDone ? 'done' : ''}`;
            c.innerHTML = `
                ${isAdmin ? `<div class="handle" style="display:block; cursor:grab; background:rgba(0,0,0,0.05); text-align:center; font-size:10px; padding:4px; margin-bottom:8px; border-radius:5px;">⠿ 드래그 이동</div>` : ''}
                ${img ? `<img src="${img}" class="card-img" onclick="showImg('${img}')">` : ''}
                <div class="card-title">${title}</div>
                <div class="btn-row">
                    <button class="go-btn" onclick="openPlayer('${link}')">이동</button>
                    <button class="check-btn" onclick="toggleChk('${id}', this)">${isDone?'완료 ✅':'체크'}</button>
                </div>
            `;
            g.appendChild(c);
        });
    }

    // 퀵 등록 관련 함수들
    async function loadQuickMenuFromRadio() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/radio!A2:N?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            const radioData = r.values || [];
            const btnContainer = document.getElementById('quickBtns');
            btnContainer.innerHTML = ''; 
            radioData.forEach(row => {
                const title = row[4], link = row[10], timeInfo = row[13];
                if (title && link) {
                    let min = 0, sec = 0;
                    if (timeInfo) {
                        const timeMatch = timeInfo.match(/(\d+):(\d+)/) || timeInfo.match(/(\d+)분\s*(\d+)초/);
                        if (timeMatch) { min = parseInt(timeMatch[1]); sec = parseInt(timeMatch[2]); }
                    }
                    const ytLink = link.split(/[\s,]+/).find(l => l.includes('youtu')) || link.split(/[\s,]+/)[0];
                    const btn = document.createElement('button');
                    btn.className = 'chip'; btn.innerHTML = `🔥 ${title}`;
                    btn.onclick = () => quickAdd(title, ytLink, min, sec);
                    btnContainer.appendChild(btn);
                }
            });
        } catch (e) { console.error("퀵 메뉴 로드 실패:", e); }
    }

// 유튜브 링크인지 확인하는 간단한 함수
function isYoutube(url) {
    return url.includes('youtu.be') || url.includes('youtube.com');
}

function quickAdd(title, url, min, sec) {
    // 유튜브 링크가 아닐 경우 경고창 띄우고 중단
    if (!isYoutube(url)) {
        alert("유튜브 링크만 뮤밍 빌더에 담을 수 있습니다! 😊");
        return;
    }
    builderData.push({ title, url, min, sec, id: Date.now() });
    saveAndRender();
}

function saveAndRender() {
    localStorage.setItem('plaveBuilder', JSON.stringify(builderData));
    const grid = document.getElementById('builderGrid');
    grid.innerHTML = '';
    let totalSec = 0;

    builderData.forEach((item, index) => {
        totalSec += (item.min * 60) + item.sec;
        const div = document.createElement('div');
        div.className = 'builder-item';
        div.setAttribute('data-id', item.id);
        div.innerHTML = `
            <div class="v-drag-handle" style="cursor:grab; color:var(--accent); font-weight:bold; padding-right:10px;">⠿</div>
            <div style="flex:1; overflow:hidden;">
                <div style="font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${item.title}</div>
                <div style="font-size:10px; color:var(--accent); font-weight:700;">⏱️ ${item.min}분 ${item.sec}초</div>
            </div>
            <button onclick="removeFromBuilder(${index})" style="border:none; background:none; color:#ff7675; cursor:pointer; font-size:16px; font-weight:bold; padding:5px;">×</button>
        `;
        grid.appendChild(div);
    });

    const m = Math.floor(totalSec / 60), s = totalSec % 60;
    document.getElementById('totalTimeDisplay').innerText = `총 ${m}분 ${s}초`;
}
// 메인 카드 드래그 (관리자 전용)
Sortable.create(document.getElementById('grid'), {
handle: '.handle',
    animation: 200, // 살짝 더 부드럽게
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    forceFallback: true // 모바일/PC 모두 동일한 드래그 느낌을 위해
});

// 뮤밍 빌더 드래그
Sortable.create(document.getElementById('builderGrid'), {
    handle: '.v-drag-handle',
    animation: 200,
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    forceFallback: true,
    onEnd: function() {
        const newOrder = [];
        document.querySelectorAll('.builder-item').forEach(el => {
            const item = builderData.find(d => d.id == el.getAttribute('data-id'));
            if(item) newOrder.push(item);
        });
        builderData = newOrder;
        localStorage.setItem('plaveBuilder', JSON.stringify(builderData));
    }
});
    function openPlayer(url) { window.open(url, "plavePlayer", "width=1000,height=700,scrollbars=yes"); }
    function toggleChk(id, b) { const card = b.closest('.card'); card.classList.toggle('done'); localStorage.setItem(id, card.classList.contains('done')); b.innerText = card.classList.contains('done') ? '완료 ✅' : '체크'; }
    function showImg(s) { document.getElementById('modalImg').src = s; document.getElementById('modal').style.display='flex'; }
    function setCat(b, s) { document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); b.classList.add('active'); currentSheet=s; fetchData(); }
    function updateFileName(input) { document.getElementById('fileNameDisplay').innerText = input.files[0] ? input.files[0].name : "선택된 파일 없음"; processWebP(input); }
    function removeFromBuilder(idx) { builderData.splice(idx, 1); saveAndRender(); }
    function clearBuilder() { if(confirm("비울까요?")) { builderData = []; saveAndRender(); } }

    async function processWebP(input) {
        if(!input.files[0]) return;
        const file = input.files[0];
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
            canvas.width = 800; canvas.height = (800/img.width)*img.height;
            ctx.drawImage(img, 0, 0, 800, canvas.height);
            tempWebP = canvas.toDataURL('image/webp', 0.7).split(',')[1];
        };
    }

    async function submitData() {
        const btn = document.getElementById('subBtn');
        const payload = {
            sheetName: document.getElementById('sheetSelect').value,
            url: document.getElementById('regLink').value,
            userTitle: document.getElementById('regTitle').value,
            deadline: document.getElementById('regDeadline').value,
            file: tempWebP ? { base64: tempWebP, type: 'image/webp', name: 'upload' } : null
        };
        btn.innerText = "등록 중...";
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        if((await res.json()).result === "success") { alert("등록 완료!"); location.reload(); }
    }

    window.onload = () => { 
        fetchData(); 
        loadNotice(); 
        loadQuickMenuFromRadio(); 
        saveAndRender(); 
    };
</script>
</body>
</html>
