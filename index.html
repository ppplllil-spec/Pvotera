<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLLI-TUB-RA | 플리정보공간</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root { 
            --top: #2d1b4e; 
            --btm: #a29bfe; 
            --glass: rgba(255, 255, 255, 0.12); 
            --text: #ffffff; 
            --accent: #ff7675; 
            --neon-purple: #a29bfe; 
        }

        body { 
            font-family: 'Pretendard', sans-serif; 
            background: linear-gradient(160deg, var(--top), #6c5ce7, var(--btm)); 
            margin: 0; padding: 20px; min-height: 100vh; 
            color: var(--text); 
            background-attachment: fixed;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            overflow-x: hidden;
        }

        /* 1. 배경 별빛 애니메이션 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #a29bfe, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 80px 120px, #fff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: stars 100s linear infinite;
            opacity: 0.3; z-index: -1; pointer-events: none;
        }
        @keyframes stars { from { transform: translateY(0); } to { transform: translateY(-2000px); } }

        /* 2. 마우스 별가루 스타일 */
        .particle {
            position: fixed; top: 0; left: 0; width: 6px; height: 6px;
            background: var(--neon-purple); border-radius: 50%;
            pointer-events: none; z-index: 20000;
            box-shadow: 0 0 10px var(--neon-purple), 0 0 20px #fff;
            animation: fadeOut 0.8s ease-out forwards;
        }
        @keyframes fadeOut {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            100% { transform: scale(0.2) translateY(50px); opacity: 0; }
        }

        /* 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #6c5ce7; border-radius: 10px; border: 2px solid var(--top); }

        .container { width: 100%; max-width: 480px; margin: 0 auto; }
        
        /* 3. 로고 네온 사인 효과 */
        header { text-align: center; padding: 30px 0; }
        .logo { 
            font-size: 32px; font-weight: 900; color: white; letter-spacing: 2px;
            animation: neon-pulse 2s ease-in-out infinite alternate;
        }
        @keyframes neon-pulse {
            from { text-shadow: 0 0 10px rgba(162, 155, 254, 0.8); }
            to { text-shadow: 0 0 25px rgba(162, 155, 254, 1), 0 0 10px rgba(255,255,255,0.5); }
        }

        .glass-panel { 
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 30px; padding: 20px; margin-bottom: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .input-box { 
            width: 100%; padding: 14px 18px; border-radius: 18px; 
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.15); 
            color: white; outline: none; box-sizing: border-box; 
            margin-bottom: 12px; font-family: inherit; transition: 0.3s; font-size: 14px;
        }
        .input-box::placeholder { color: rgba(255,255,255,0.5); }
        input[type="datetime-local"] { font-size: 11px !important; padding: 10px 5px !important; color-scheme: dark; }

        .chip { 
            padding: 10px 22px; border-radius: 50px; background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2); font-size: 14px; font-weight: 700; 
            cursor: pointer; white-space: nowrap; color: white; transition: 0.4s;
        }
        .chip.active { background: white; color: #6c5ce7; box-shadow: 0 0 20px rgba(255,255,255,0.4); }

        /* 4. 카드 슬롯 및 둥둥 떠다니는 애니메이션 */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; transition: 0.3s; }
        .card { 
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); 
            border-radius: 25px; padding: 15px; border: 1px solid rgba(255,255,255,0.15); 
            display: flex; flex-direction: column; position: relative;
            animation: floating 4s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.2s);
        }
        @keyframes floating { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .card:hover { 
            transform: translateY(-15px) scale(1.02) !important; 
            background: rgba(255,255,255,0.2); border-color: white; 
            box-shadow: 0 0 25px rgba(162, 155, 254, 0.5); z-index: 5;
        }
        .card-img { width: 100%; height: 95px; border-radius: 18px; object-fit: cover; margin-bottom: 8px; border: 2px solid rgba(255,255,255,0.1); }
        .card-title { font-size: 13px; font-weight: 800; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 8px; color: #f1f2f6; }
        
        .go-btn { 
            width: 100%; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; 
            padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer;
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4); transition: 0.2s;
        }
        .go-btn:active { transform: scale(0.95); filter: brightness(1.2); }

        /* 팁 카드 컴팩트 모드 */
        .card-grid.tips-mode { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .card.tip-card { border: 1.5px solid var(--neon-purple) !important; padding: 8px !important; min-height: auto !important; }
        .card.tip-card .card-img { height: 55px !important; }
        .card.tip-card .card-title { font-size: 11px !important; height: auto !important; -webkit-line-clamp: 1 !important; color: white; text-align: center; }
        .card.tip-card .go-btn { background: white; color: #6c5ce7; box-shadow: none; }

        .tip-link-badge { 
            position: absolute; top: 10px; right: 10px; background: white; color: #6c5ce7; 
            padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 900; z-index: 10; 
        }

        #registrationPanel { display: none; position: fixed; z-index: 10000; bottom: 100px; right: 25px; width: 320px; }
        .fab-btn { 
            position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; 
            background: white; color: #6c5ce7; border-radius: 50%; font-size: 35px; border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 10001; transition: 0.3s; 
        }
        .fab-btn.active { background: var(--accent); color: white; transform: rotate(45deg); }

        @media (min-width: 1024px) {
            .container { max-width: 1300px; }
            #mainLayout { display: flex; gap: 25px; }
            #gridContainer { flex: 1; }
            .sidebar { width: 320px; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 20px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            .card-grid.tips-mode { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
        }
    </style>
</head>
<body>

<div id="modal" onclick="this.style.display='none'"><img id="modalImg"></div>
<div id="thanksPopup" class="thanks-popup">💜 소중한 제보 감사해요! 💜</div>
<button class="fab-btn" id="fabBtn" onclick="toggleRegPanel()">+</button>

<div class="container">
    <header onclick="askAdmin()"><div class="logo">PLLI-TUB-RA</div></header>

    <div id="registrationPanel" class="glass-panel">
        <div style="font-weight: 900; margin-bottom: 15px; display: flex; justify-content: space-between;">
            <span>🗳️ 정보 등록</span>
            <span onclick="toggleRegPanel()" style="cursor:pointer; opacity:0.5;">✕</span>
        </div>
        <select id="regTargetSheet" class="input-box" onchange="toggleRegFields()">
            <option value="data">🌟 일반 정보 / 투표 등록</option>
            <option value="tips">💡 투표 앱 팁 등록</option>
        </select>
        <div id="voteAppArea">
            <select id="regVoteApp" class="input-box">
                <option value="">투표 앱 선택 (해당 시)</option>
                <option value="kooky">kooky</option><option value="덕애드">덕애드</option><option value="딩고">딩고</option>
                <option value="링크/tin">링크/tin</option><option value="마이원픽">마이원픽</option><option value="뮤니버스">뮤니버스</option>
                <option value="뮤빗">뮤빗</option><option value="벅스">벅스</option><option value="셀럽챔프">셀럽챔프</option>
                <option value="스타트렌드">스타트렌드</option><option value="아이도키">아이도키</option><option value="아이돌챔프">아이돌챔프</option>
                <option value="아이돌픽">아이돌픽</option><option value="유센">유센</option><option value="유픽">유픽</option>
                <option value="주간인기상">주간인기상</option><option value="최애돌">최애돌</option><option value="팬캐스트">팬캐스트</option>
                <option value="팬앤스타">팬앤스타</option><option value="팬플러스">팬플러스</option><option value="포도알">포도알</option>
                <option value="피크닠">피크닠</option><option value="하이어">하이어</option><option value="후즈팬">후즈팬</option>
            </select>
        </div>
        <input type="text" id="regImg" class="input-box" placeholder="🖼️ 이미지 주소">
        <input type="text" id="regLink" class="input-box" placeholder="🔗 링크 주소">
        <input type="text" id="regTitle" class="input-box" placeholder="📝 제목">
        <div id="dateInputArea" style="display: flex; gap: 5px;">
            <input type="datetime-local" id="regStart" class="input-box">
            <input type="datetime-local" id="regDeadline" class="input-box">
        </div>
        <button onclick="submitData()" id="subBtn" class="go-btn" style="padding:15px; border-radius:18px;">등록하기</button>
    </div>

    <input type="text" id="search" class="input-box" placeholder="검색어를 입력하세요..." oninput="renderCards()">
    <div class="cat-group">
        <div class="chip active" onclick="setCat(this, 'data')">🌟 전체</div>
        <div class="chip" onclick="setCat(this, 'tips')">🗳️ 투표 팁</div>
        <div class="chip" onclick="location.href='./radio/index.html'">📻 라디오</div>
    </div>

    <div id="mainLayout">
        <div id="gridContainer"><div class="card-grid" id="grid"></div></div>
        <div class="sidebar">
            <div class="glass-panel"><div style="font-weight: 900; margin-bottom: 10px; color: var(--neon-purple);">📢 NOTICE</div><div id="noticeDisplay" style="font-size: 12px; line-height: 1.6;"></div></div>
            <div class="glass-panel" style="border: 2px solid var(--neon-purple);">
                <div style="font-weight: 900; margin-bottom: 12px; display: flex; justify-content: space-between;"><span>🎧 뮤밍 빌더</span><button onclick="openBuilderModal()" class="chip" style="background:white; color:#6c5ce7; border:none; padding:4px 10px; font-size: 11px;">+ 편집</button></div>
                <div id="totalTimeDisplay" style="font-size: 11px; color: var(--neon-purple); margin-bottom:10px;">총 0분 0초</div>
                <div id="builderGrid"></div>
                <div style="margin-top: 10px; display: flex; gap: 5px;"><button onclick="playBuilderList()" class="go-btn" style="flex:1;">▶ 전체재생</button><button onclick="clearBuilder()" class="go-btn" style="flex:0.4; background:rgba(255,255,255,0.2); box-shadow: none;">삭제</button></div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwsaZ9xNvPdZENLmjS-V0sWy22ItvR43YAr3b1K2qTkHrfjUgSedbqnAVpQ2hdc040T/exec";
    let cachedData = [], tipsData = [], currentSheet = 'data', isAdmin = false;

    // 🆕 마우스/터치 별가루 효과 로직
    document.addEventListener('mousemove', (e) => createParticle(e.clientX, e.clientY));
    document.addEventListener('touchmove', (e) => createParticle(e.touches[0].clientX, e.touches[0].clientY));

    function createParticle(x, y) {
        if (Math.random() > 0.15) return; 
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 6 + 2;
        p.style.width = p.style.height = `${size}px`;
        const colors = ['#a29bfe', '#6c5ce7', '#efebff', '#ffffff'];
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = `${x}px`; p.style.top = `${y}px`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
    }

    function toggleRegPanel() {
        const p = document.getElementById('registrationPanel');
        const b = document.getElementById('fabBtn');
        const isV = p.style.display === 'block';
        if (!isV) {
            const now = new Date();
            const after3 = new Date(); after3.setDate(now.getDate() + 3);
            document.getElementById('regStart').value = now.toISOString().slice(0, 16);
            document.getElementById('regDeadline').value = after3.toISOString().slice(0, 16);
        }
        p.style.display = isV ? 'none' : 'block';
        b.classList.toggle('active', !isV);
    }

    function toggleRegFields() {
        const target = document.getElementById('regTargetSheet').value;
        document.getElementById('dateInputArea').style.display = target === 'tips' ? 'none' : 'flex';
        document.getElementById('voteAppArea').style.display = target === 'tips' ? 'none' : 'block';
        document.getElementById('regTitle').placeholder = target === 'tips' ? "📝 앱 이름" : "📝 제목";
    }

    async function fetchTipsOnly() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/tips!A2:N?key=${API_KEY}`).then(res => res.json());
        tipsData = r.values || [];
    }

    async function fetchData() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${currentSheet}!A2:N?key=${API_KEY}`).then(res => res.json());
        cachedData = r.values || [];
        renderCards();
    }

    function renderCards() {
        const q = document.getElementById('search').value.toLowerCase();
        const g = document.getElementById('grid'); g.innerHTML = '';
        if (currentSheet === 'tips') g.classList.add('tips-mode'); else g.classList.remove('tips-mode');

        const displayData = isAdmin ? cachedData : [...cachedData].reverse();
        displayData.forEach((row, index) => {
            const [date, link, cat, appName, title, start, deadline, img] = row;
            if(q && !title.toLowerCase().includes(q)) return;
            const div = document.createElement('div');
            const isT = currentSheet === 'tips';
            div.className = `card ${isT ? 'tip-card' : ''}`;
            div.style.setProperty('--i', index); // 애니메이션 엇박자용

            let badge = "";
            if (!isT && appName && tipsData.find(t => t[4] === appName)) {
                badge = `<div class="tip-link-badge" onclick="event.stopPropagation(); setCat(null, 'tips')">💡 팁</div>`;
            }
            div.innerHTML = `${badge}${img?`<img src="${img}" class="card-img" onclick="showImg('${img}')">`:''}<div class="card-title">${title}</div><button class="go-btn" onclick="window.open('${link}','_blank')">${isT?'보기':'이동'}</button>`;
            g.appendChild(div);
        });
    }

    async function submitData() {
        const target = document.getElementById('regTargetSheet').value;
        const btn = document.getElementById('subBtn');
        const payload = { 
            sheetName: target,
            url: document.getElementById('regLink').value.trim(), 
            userTitle: document.getElementById('regTitle').value.trim(), 
            tag: target === 'data' ? document.getElementById('regVoteApp').value : "", 
            start: target === 'data' ? document.getElementById('regStart').value : "", 
            deadline: target === 'data' ? document.getElementById('regDeadline').value : "",
            img: document.getElementById('regImg').value.trim()
        };
        if (!payload.url || !payload.userTitle) return alert("입력 확인!");
        btn.innerText = "등록 중..."; btn.disabled = true;
        try {
            const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
            const result = await res.json();
            if(result.result === "success") { 
                document.getElementById('thanksPopup').style.display='block'; setTimeout(()=>document.getElementById('thanksPopup').style.display='none', 2000);
                toggleRegPanel(); fetchData(); await fetchTipsOnly();
            }
        } catch (e) { alert("실패"); } finally { btn.innerText = "등록하기"; btn.disabled = false; }
    }

    function setCat(chip, s) { 
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        if(chip) chip.classList.add('active'); 
        currentSheet = s; fetchData(); 
    }

    function showImg(s) { document.getElementById('modalImg').src = s; document.getElementById('modal').style.display='flex'; }
    function askAdmin() { if(prompt("비번?")==="0312") { isAdmin=true; fetchData(); } }
    async function loadNotice() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/notice!A:A?key=${API_KEY}`).then(res => res.json());
        document.getElementById('noticeDisplay').innerHTML = (r.values || []).map(n => `• ${n[0]}<br>`).join('');
    }
    window.onload = async () => { await fetchTipsOnly(); fetchData(); loadNotice(); };
</script>
</body>
</html>
