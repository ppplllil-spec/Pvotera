<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플리튭라정보</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root {
            --bg-top: #c5c9f4; --bg-bottom: #fbc2eb;
            --glass-white: rgba(255, 255, 255, 0.4); --glass-border: rgba(255, 255, 255, 0.6);
            --text-color: #4b4b7c; --accent-pink: #ff85a1; --accent-blue: #7d93eb;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            background-attachment: fixed; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: var(--text-color);
        }
        body::before {
            content: "♥"; position: fixed; top: 15%; right: 10%;
            font-size: 150px; color: rgba(255, 255, 255, 0.2); filter: blur(5px); z-index: -1;
        }
        .container { width: 100%; max-width: 480px; }
        header { text-align: center; padding: 30px 0; }
        .logo { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); letter-spacing: -1px; }
        .glass-input-panel {
            background: var(--glass-white); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; padding: 25px; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 30px;
        }
        .input-row input, .input-row select {
            width: 100%; border: none; background: rgba(255,255,255,0.3);
            border-radius: 15px; padding: 15px; margin-bottom: 12px;
            font-size: 14px; outline: none; color: var(--text-color); box-sizing: border-box; font-family: inherit;
        }
        .cat-group { display: flex; gap: 8px; margin-bottom: 15px; justify-content: center; flex-wrap: wrap; }
        .chip {
            padding: 8px 18px; border-radius: 20px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.2); color: var(--text-color); font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .chip.active { background: white; color: var(--accent-blue); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .submit-btn {
            width: 100%; padding: 16px; border-radius: 20px; border: none;
            background: linear-gradient(90deg, #a1c4fd 0%, #c2e9fb 100%); color: white; font-weight: 800; cursor: pointer;
        }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .card {
            background: rgba(255, 255, 255, 0.45); backdrop-filter: blur(10px);
            border-radius: 25px; padding: 18px; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; transition: 0.3s;
        }
        .tag { font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 10px; width: fit-content; margin-bottom: 10px; color: white; }
        .tag-vote { background: var(--accent-pink); }
        .tag-info { background: var(--accent-blue); }
        .tag-daily { background: #55efc4; color: #1e6b54 !important; }
        .tag-last { background: #fab1a0; color: #8d3e2b !important; }
        .tag-urgent { background: #ff7675; animation: blink 1s infinite; }
        .tag-upcoming { background: #b2bec3; }

        @keyframes blink { 50% { opacity: 0.7; } }

        .card-title { font-size: 14px; font-weight: 700; line-height: 1.4; color: var(--text-color); margin-bottom: 10px; }
        .status-text { font-size: 11px; font-weight: 600; margin-bottom: 10px; }
        .go-btn {
            text-align: center; text-decoration: none; padding: 8px; background: rgba(255,255,255,0.5);
            border-radius: 12px; border: none; font-size: 12px; font-weight: 800; color: var(--text-color); width: 100%; cursor: pointer;
        }
        .tip-image { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
        .card.show-tip .tip-image { display: block; }
    </style>
</head>
<body>

<div class="container">
    <header><div class="logo">플리튭라정보공유</div></header>
    
    <div style="position: fixed; top: 20px; right: 20px; z-index: 100;">
        <button onclick="toggleEditMode()" style="background: var(--glass-white); border: 1px solid var(--glass-border); border-radius: 50%; width: 40px; height: 40px; cursor: pointer; font-size: 20px;">⚙️</button>
    </div>

    <div class="glass-input-panel">
        <div class="input-row">
            <input type="text" id="linkInput" placeholder="🔗 공유할 링크를 넣어주세요">
            <input type="text" id="titleInput" placeholder="📝 제목/상세 내용을 적어주세요">

            <div id="voteAppArea" style="display:none;">
                <select id="voteAppSelect" onchange="applyAppTitle()">
                    <option value="">-- 투표 앱을 선택하세요 --</option>
                    <option value="주간인기상">주간인기상</option><option value="최애돌">최애돌</option>
                    <option value="하이어">하이어</option><option value="딩고">딩고</option>
                    <option value="스타트렌드">스타트렌드</option><option value="링크/tin">링크/tin</option>
                    <option value="마이원픽">마이원픽</option><option value="뮤니버스">뮤니버스</option>
                    <option value="뮤빗">뮤빗</option><option value="벅스">벅스</option>
                    <option value="후즈팬">후즈팬</option><option value="팬앤스타">팬앤스타</option>
                    <option value="팬캐스트">팬캐스트</option><option value="팬플러스">팬플러스</option>
                    <option value="포도알">포도알</option><option value="피크닠">피크닠</option>
                    <option value="아이도키">아이도키</option><option value="아이돌챔프">아이돌챔프</option>
                    <option value="아이돌픽">아이돌픽</option><option value="유센">유센</option>
                    <option value="유픽">유픽</option><option value="셀럽챔프">셀럽챔프</option>
                    <option value="기타">기타(직접입력)</option>
                </select>
            </div>

            <div id="radioAppArea" style="display:none;">
                <select id="radioAppSelect" onchange="applyRadioTitle()">
                    <option value="">-- 라디오 채널을 선택하세요 --</option>
                    <optgroup label="🇰🇷 국내 KBS">
                        <option value="https://program.kbs.co.kr/2fm/radio/stationzero/mobile/board.html?smenu=e5c2d2&bbs_loc=R2024-0068-03-4183,list,none,1,0">K-스테제로</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/stationx/mobile/board.html?smenu=f2fa28&bbs_loc=R2024-0203-03-105048,list,none,1,0">K-스테엑스</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/ejgayo/mobile/board.html?smenu=ebbbd1&bbs_loc=R2023-0057-03-858128,list,none,1,0">K-가요광장</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/superradio/mobile/board.html?smenu=654b54&bbs_loc=R2024-0241-03-865497,list,none,1,0">K-하하슈퍼</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/misterradio/mobile/board.html?smenu=e5c2d2&bbs_loc=A2019-0002-03-50838,list,none,1,0">K-미스터라디오</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/hanhaekiss/mobile/board.html?smenu=ba2c4f&bbs_loc=R2025-0082-03-761603,list,none,1,0">K-키라더(일)</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/hanhaekiss/mobile/board.html?smenu=66d014&bbs_loc=R2025-0082-03-789244,list,none,1,0">K-놀초대(화/목)</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/hyojung_volume/mobile/board.html?smenu=1a3558&bbs_loc=R2024-0245-03-718543,list,none,1,0">K-볼륨up(금)</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/hyojung_volume/mobile/board.html?smenu=8d08c6&bbs_loc=R2024-0245-03-873759,list,none,1,0">K-볼륨up(토)</option>
                        <option value="https://program.kbs.co.kr/2fm/radio/hyojung_volume/mobile/board.html?smenu=13fca5&bbs_loc=R2024-0245-03-94886,list,none,1,0">K-볼륨up(일)</option>
                    </optgroup>
                    <optgroup label="🇰🇷 국내 MBC">
                        <option value="https://m.imbc.com/imbbs/imbbslist/1005604100000100000?bid=bfever01&pos=radio&menu=mn-daily">M-친친방</option>
                        <option value="https://m.imbc.com/imbbs/imbbslist/1000672100000100000?bid=pstarnight212&pos=radio&menu=mn-basic">M-별밤</option>
                        <option value="https://m.imbc.com/TalkBBS/TalkList/1000586100000100000?bid=3447&menu=mn-daily">M-두시의데이트</option>
                    </optgroup>
                    <optgroup label="🇰🇷 국내 SBS">
                        <option value="https://m.programs.sbs.co.kr/radio/sbs12n/boards/83474">S-12시엔</option>
                        <option value="https://m.programs.sbs.co.kr/radio/cultwoshow/boards/58047">S-컬투쇼</option>
                        <option value="https://m.programs.sbs.co.kr/radio/kingcastlepower/boards/74230">S-황제파워</option>
                        <option value="https://m.programs.sbs.co.kr/radio/lovegame/boards/57679">S-러브게임</option>
                        <option value="https://m.programs.sbs.co.kr/radio/wendy0s/boards/69691">S-영스트리트</option>
                        <option value="https://m.programs.sbs.co.kr/radio/ten/boards/57950">S-배텐</option>
                        <option value="https://programs.sbs.co.kr/radio/0chulpowerfm/cornerboards/57577/?cornerid=3005&cmd=list">S-영철파워FM</option>
                    </optgroup>
                    <optgroup label="🌎 해외 라디오">
                        <option value="https://docs.google.com/forms/d/e/1FAIpQLSfyVYf-rss5jZ0uA6RHIkb-Im180whM7I_U98HLnpu3w1C4cw/viewform">WPVR 뉴욕 (구글폼)</option>
                        <option value="https://x.com/i/communities/1707176199129014533">WPVR 뉴욕 (X 커뮤니티)</option>
                        <option value="https://onlyhit.us/en/contact/">Only Hit</option>
                        <option value="http://hot106.cgrmedia.ca/request">Hot 106 (Canada)</option>
                        <option value="http://m-on.jp/request/">M-ON (Japan)</option>
                        <option value="http://wyyt1063.com/request">WYYT 106.3</option>
                        <option value="https://ecaradio2.weebly.com/song-requests.html">ECA Radio</option>
                        <option value="https://www.bossglobalradio.com/request">Boss Global</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="cat-group">
            <button class="chip active" onclick="setCat(this, 'ALL', '전체보기')">🌟 전체</button>
            <button class="chip" onclick="setCat(this, 'INFO', '정보/광고')">📢 정보</button>
            <button class="chip" onclick="setCat(this, 'VOTE', '투표')">🗳️ 투표</button>
            <button class="chip" onclick="setCat(this, 'RADIO', '라디오')">📻 라디오</button>
        </div>

        <div id="timeArea" style="display:none; margin-bottom:15px;">
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label style="font-size:11px; color:white; font-weight:bold; margin-bottom:5px; display:block;">⏰ 마감 일시</label>
                    <input type="datetime-local" id="deadlineInput" style="width:100%; border:none; padding:10px; border-radius:12px; background:rgba(255,255,255,0.4); color:var(--text-color); font-size: 12px;">
                </div>
            </div>
        </div>
<div style="margin-bottom:15px;">
    <label style="font-size:11px; color:white; font-weight:bold; margin-bottom:5px; display:block;">🖼️ 가이드 이미지 첨부 (선택)</label>
    <input type="file" id="fileInput" accept="image/*" style="width:100%; color:white; font-size:12px;">
</div>
        <button class="submit-btn" onclick="submitLink()">등록하기</button>
    </div>

    <div class="card-grid" id="mainGrid">
        <div style="grid-column: 1/3; text-align: center; color: white;">데이터를 불러오는 중...</div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbywBQMHYul3tNDcRJnMgBVICkeyR0yflkB7adCEcQAWsrXv3zU-9aLgl8YBe3mFm6xijg/exec";
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    
    let selectedTag = 'ALL', selectedName = '전체보기', cachedRows = [], isEditMode = false;
    const ADMIN_PW = "0312", RADIO_MESSAGES = {
        GLOBAL: "I would like to request [곡제목] by PLAVE ✨",
        KOREA: "플레이브 신청곡과 사연 부탁드려요! 📻"
    };

    function setCat(btn, tag, name) {
        document.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTag = tag; selectedName = name;
        
        document.getElementById('voteAppArea').style.display = (tag === 'VOTE') ? 'block' : 'none';
        document.getElementById('radioAppArea').style.display = (tag === 'RADIO') ? 'block' : 'none';
        document.getElementById('timeArea').style.display = (tag === 'VOTE' || tag === 'RADIO') ? 'block' : 'none';
        
        renderCards(cachedRows);
    }

    function applyAppTitle() {
        const val = document.getElementById('voteAppSelect').value;
        if(val && val !== "기타") document.getElementById('titleInput').value = `[${val}] 투표 부탁드려요!`;
    }

    function applyRadioTitle() {
        const select = document.getElementById('radioAppSelect');
        const linkInput = document.getElementById('linkInput');
        const titleInput = document.getElementById('titleInput');
        if(select.value) {
            linkInput.value = select.value;
            const option = select.options[select.selectedIndex];
            const group = option.parentElement.label;
            if (group.includes('해외')) titleInput.value = RADIO_MESSAGES.GLOBAL;
            else titleInput.value = `[${option.text}] ${RADIO_MESSAGES.KOREA}`;
        }
    }

    function toggleEditMode() {
        if (prompt("관리자 비밀번호를 입력하세요.") === ADMIN_PW) {
            isEditMode = !isEditMode;
            alert(isEditMode ? "편집 모드 활성화 🛠️" : "편집 모드 해제");
            renderCards(cachedRows);
        } else alert("비밀번호가 틀렸습니다.");
    }

    async function deleteLink(url) {
        if (!confirm("이 항목을 정말 삭제할까요?")) return;
        const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: "delete", url: url }) });
        const data = await res.json();
        if (data.result === "success") { alert("삭제되었습니다."); location.reload(); }
    }

   async function submitLink() {
    const url = document.getElementById('linkInput').value;
    const fileInput = document.getElementById('fileInput');
    if(!url) return alert("링크를 입력해 주세요!");

    const btn = document.querySelector('.submit-btn');
    btn.innerText = "🚀 등록 중 (이미지 포함 시 시간이 걸릴 수 있습니다)..."; 
    btn.disabled = true;

    let fileData = null;

    // 파일을 선택했다면 베이스64로 변환
    if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        fileData = await new Promise((resolve) => {
            reader.onload = (e) => resolve({
                base64: e.target.result.split(',')[1],
                name: file.name,
                type: file.type
            });
            reader.readAsDataURL(file);
        });
    }

    try {
        await fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify({ 
                url: url, 
                userTitle: document.getElementById('titleInput').value,
                category: selectedName, 
                tag: selectedTag,
                deadline: document.getElementById('deadlineInput').value,
                file: fileData // 이미지 데이터 추가
            })
        });
        alert("등록 성공! ✨");
        location.reload();
    } catch (e) {
        alert("등록 중 오류가 발생했습니다.");
        btn.innerText = "등록하기";
        btn.disabled = false;
    }
}

    async function fetchCards() {
        const RANGE = 'data!A2:H'; 
        const fetchUrl = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${RANGE}?key=${API_KEY}`;
        try {
            const response = await fetch(fetchUrl);
            const data = await response.json();
            cachedRows = data.values || [];
            renderCards(cachedRows);
        } catch (e) { console.error(e); }
    }

    // 복사 및 이동 함수
    function copyAndGo(link, title) {
        navigator.clipboard.writeText(title).then(() => {
            alert("신청 문구가 복사되었습니다! ✨\n사이트에서 붙여넣기(Ctrl+V) 하세요.");
            window.open(link, '_blank');
        }).catch(() => {
            window.open(link, '_blank');
        });
    }

    function renderCards(rows) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = ''; const now = new Date();
        if (!rows || rows.length === 0) { grid.innerHTML = '<div style="grid-column: 1/3; text-align: center; color: white;">데이터가 없습니다.</div>'; return; }

        const filtered = rows.filter(r => {
            if (!r || !r[1]) return false;
            if (r[6] && new Date(r[6]) < now) return false;
            if (selectedTag === 'ALL') return r[3] !== 'RADIO';
            if (selectedTag === 'VOTE') return r[3].startsWith('VOTE');
            return r[3] === selectedTag;
        });

        if (filtered.length === 0) { grid.innerHTML = `<div style="grid-column: 1/3; text-align: center; color: white; padding: 40px 0;">활성화된 '${selectedName}' 정보가 없습니다.</div>`; return; }

        filtered.reverse().forEach(row => {
            const [date, link, category, tag, title, start, deadline, tipImgUrl] = row;
            const card = document.createElement('div'); card.className = 'card';
            if (tipImgUrl) card.onclick = () => card.classList.toggle('show-tip');

            const e = deadline ? new Date(deadline) : null;
            let tagClass = 'tag-info', displayTag = tag;

            if (e && (e - now < 86400000)) { tagClass = 'tag-urgent'; displayTag = '🔥 오늘마감'; }
            else if (tag === 'VOTE_DAILY') { tagClass = 'tag-daily'; displayTag = '✅ 매일필수'; }
            else if (tag === 'VOTE_LAST') { tagClass = 'tag-last'; displayTag = '⏳ 마판용'; }
            else if (tag === 'RADIO') { displayTag = '📻 RADIO'; }
            else if (tag === 'VOTE') { tagClass = 'tag-vote'; displayTag = 'VOTE'; }

            // 버튼 생성 (라디오일 때만 복사 기능 적용)
            const btnHtml = (tag === 'RADIO')
                ? `<button onclick="copyAndGo('${link}', '${title.replace(/'/g, "\\'")}'); event.stopPropagation();" class="go-btn">바로가기 & 문구복사</button>`
                : `<a href="${link}" target="_blank" class="go-btn" onclick="event.stopPropagation();">바로가기</a>`;

            card.innerHTML = `
                <div>
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                        <span class="tag ${tagClass}">${displayTag}</span>
                        ${isEditMode ? `<button onclick="deleteLink('${link}')" style="background: #ff7675; color: white; border: none; border-radius: 8px; padding: 5px 10px; font-size: 10px; cursor: pointer; font-weight: bold;">삭제</button>` : ''}
                    </div>
                    <div class="card-title">${title || '정보'}</div>
                    ${e ? `<div class="status-text" style="color: #ff4d4d;">⏰ ${e.toLocaleString([], {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'})} 마감</div>` : ''}
                    ${tipImgUrl ? `<img src="${tipImgUrl}" class="tip-image">` : ''}
                </div>
                ${btnHtml}
            `;
            grid.appendChild(card);
        });
    }
    window.onload = fetchCards;
</script>
</body>
</html>
