<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>플리튭라정보</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --top: #c5c9f4; --btm: #fbc2eb; --glass: rgba(255,255,255,0.4); --text: #4b4b7c; --accent: #7d93eb; }
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, var(--top), var(--btm)); margin: 0; padding: 20px; min-height: 100vh; color: var(--text); background-attachment: fixed; }
        
        /* 스크롤바 커스텀 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .container { width: 100%; max-width: 480px; margin: 0 auto; transition: 0.3s; }
        header { text-align: center; padding: 20px 0; cursor: pointer; }
        .logo { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.3); }
        .input-box { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid var(--glass); background: white; outline: none; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        
        .admin-only { display: none; }
        .cat-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; }
        .chip { padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.2); border: 1px solid var(--glass); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
        .chip.active { background: white; color: var(--accent); }

        /* 카드 그리드 */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border-radius: 22px; padding: 12px; border: 1px solid var(--glass); display: flex; flex-direction: column; transition: 0.3s; position: relative; user-select: none; }
        .card.done { opacity: 0.5; filter: grayscale(0.8); }
        .card-img { width: 100%; height: 95px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; cursor: pointer; }
        .card-title { font-size: 13px; font-weight: 800; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

        .btn-row { display: flex; gap: 5px; margin-top: auto; }
        .go-btn, .check-btn { flex: 1; border: none; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; }
        .go-btn { background: white; color: var(--text); }
        .check-btn { background: var(--accent); color: white; }

        /* 🆕 제보 패널 플로팅 설정 */
        #registrationPanel {
            display: none; 
            position: fixed;
            z-index: 10000;
            bottom: 100px;
            right: 25px;
            width: 350px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🆕 플로팅 버튼 (+) */
        .fab-btn {
            position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px;
            background: var(--accent); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; font-weight: 200; cursor: pointer;
            box-shadow: 0 8px 20px rgba(125,147,235,0.5);
            z-index: 10001; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: none;
        }
        .fab-btn:hover { transform: scale(1.1); }
        .fab-btn.active { background: #ff7675; transform: rotate(45deg); }

        /* 감사 팝업 */
        .thanks-popup { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 25px; border-radius: 50px; font-weight: 900; box-shadow: 0 10px 20px rgba(0,0,0,0.1); z-index: 5000; display: none; }

/* ✨ PC 레이아웃 최적화: 진짜 사이드바 스타일 (가로폭 고정) */
@media (min-width: 1024px) {
    .container { 
        max-width: 1300px; /* 전체 너비 살짝 조정 */
    }
    #mainLayout { 
        display: flex; 
        gap: 25px; 
        align-items: start; 
        justify-content: center;
    }
    #gridContainer { 
        flex: 1; /* 사이드바를 제외한 나머지 공간을 전부 사용 */
    }
    .sidebar { 
        width: 320px; /* 사이드바를 320px로 고정! 딱 보기 좋은 사이즈입니다. */
        min-width: 320px;
        position: sticky; 
        top: 20px; 
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .card-grid { 
        /* 메인이 넓어졌으니 카드 개수를 자동으로 늘려줍니다 */
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); 
        gap: 20px; 
    }
    #builderGrid {
        /* 사이드바가 좁아졌으니 빌더는 다시 1열로 깔끔하게 나열 */
        display: flex !important;
        flex-direction: column !important;
    }
}

        /* 모바일 대응 */
        @media (max-width: 768px) {
            #registrationPanel { width: calc(100% - 40px); left: 20px; bottom: 95px; }
        }

        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:4000; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 15px; }
        .file-label { display: block; background: white; color: var(--text); padding: 12px; border-radius: 15px; border: 1px solid var(--glass); font-size: 14px; font-weight: 700; text-align: center; cursor: pointer; margin-bottom: 10px; }
        #regFile { display: none; }
    </style>
</head>
<body>

<div id="modal" onclick="this.style.display='none'"><img id="modalImg"></div>
<div id="thanksPopup" class="thanks-popup">소중한 제보 감사해요!</div>

<button class="fab-btn" id="fabBtn" onclick="toggleRegPanel()">+</button>

<div class="container">
    <header onclick="askAdmin()"><div class="logo">플리정보공간</div></header>

    <div id="adminNoticePanel" class="glass-panel admin-only" style="margin-bottom: 20px;">
        <div style="font-weight: 900; margin-bottom: 10px;">📢 실시간 공지사항 수정</div>
        <textarea id="noticeInput" class="input-box" style="height: 80px; resize: none;"></textarea>
        <button onclick="saveNotice()" id="noticeBtn" class="check-btn" style="width:100%; padding:10px;">공지 저장</button>
    </div>

    <div id="registrationPanel" class="glass-panel">
        <div style="font-weight: 900; margin-bottom: 15px; color: var(--text); display: flex; justify-content: space-between;">
            <span>🗳️ 정보 제보 및 등록</span>
            <span onclick="toggleRegPanel()" style="cursor:pointer; opacity:0.5;">✕</span>
        </div>
        <select id="sheetSelect" class="input-box"><option value="data">🗳️ 투표/정보 제보</option></select>
        <input type="text" id="regLink" class="input-box" placeholder="🔗 링크 주소">
        <input type="text" id="regTitle" class="input-box" placeholder="📝 제목 (자동 추출 예정)">
        <input type="datetime-local" id="regDeadline" class="input-box">
        <label for="regFile" class="file-label">🖼️ 이미지 선택 (선택)</label>
        <input type="file" id="regFile" accept="image/*" onchange="updateFileName(this)">
        <span id="fileNameDisplay" style="font-size:11px; color:var(--accent); display:block; text-align:center; margin-bottom:10px;">선택된 파일 없음</span>
        <button onclick="submitData()" id="subBtn" class="check-btn" style="width:100%; padding:15px;">등록하기</button>
    </div>

    <input type="text" id="search" class="input-box search-box" placeholder="검색어를 입력하세요..." oninput="renderCards()">

    <div class="cat-group">
        <div class="chip active" onclick="setCat(this, 'data')">🌟 전체</div>
        <div class="chip" onclick="setCat(this, 'streaming')">🎧 뮤밍</div>
        <div class="chip" onclick="location.href='./radio/index.html'">📻 라디오</div>
    </div>

    <div id="mainLayout">
        <div id="gridContainer"><div class="card-grid" id="grid"></div></div>

        <div class="sidebar">
            <div class="glass-panel">
                <div style="font-weight: 900; margin-bottom: 10px;">📢 NOTICE</div>
                <div id="noticeDisplay" style="font-size: 12px; line-height: 1.6; opacity: 0.9;"></div>
            </div>

            <div class="glass-panel" style="border: 2px solid var(--accent);">
                <div style="font-weight: 900; margin-bottom: 15px; display: flex; justify-content: space-between;">
                    <span>🎧 나만의 실시간 뮤밍리스트</span>
                    <div id="totalTimeDisplay" style="background: var(--accent); color: white; padding: 4px 10px; border-radius: 10px; font-size: 12px;">0분 0초</div>
                </div>
                <div id="quickBtns" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.05);"></div>
                <div id="builderGrid" style="min-height: 50px;"></div>
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <button onclick="playBuilderList()" class="check-btn" style="flex: 1; background: #555;">▶ 재생</button>
                    <button onclick="clearBuilder()" class="go-btn" style="flex: 0.4; border: 1px solid #ddd;">삭제</button>
                </div>
            </div>

            <div class="glass-panel" style="height: 400px; display: flex; flex-direction: column;">
                <div style="font-weight: 900; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span>💬 플리 대기실</span>
                    <button onclick="changeNick()" style="font-size:10px; border:none; background:none; color:var(--accent); cursor:pointer; opacity: 0.7;">(변경)</button>
                </div>
                <div id="chatMessages" style="flex:1; overflow-y:auto; background:rgba(255,255,255,0.3); border-radius:15px; padding:10px; font-size:12px; margin-bottom:10px;"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chatInput" class="input-box" style="margin-bottom:0; flex: 1;" placeholder="메시지 입력..." onkeypress="if(event.keyCode==13) window.sendChat()">
                    <button onclick="window.sendChat()" class="check-btn" style="flex: 0.3;">전송</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDZQL2iDN220bBdU0xiYDShqLRRp6AQJDI",
        authDomain: "chat-9035a.firebaseapp.com",
        databaseURL: "https://chat-9035a-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "chat-9035a",
        storageBucket: "chat-9035a.firebasestorage.app",
        messagingSenderId: "807179401789",
        appId: "1:807179401789:web:644359473a0cb1e05f4854",
        measurementId: "G-BKQNKVRB8X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');

    let myNick = localStorage.getItem('chatNickname') || "플리_" + Math.floor(Math.random()*1000);
    localStorage.setItem('chatNickname', myNick);

    window.changeNick = function() {
        const newNick = prompt("새로운 닉네임을 입력하세요.");
        if (newNick && newNick.trim() !== "") {
            localStorage.setItem('chatNickname', newNick.substring(0, 8));
            location.reload();
        }
    };

    window.sendChat = function() {
        const input = document.getElementById('chatInput');
        const msg = input.value.trim();
        if (!msg) return;
        push(chatRef, { nick: myNick, msg: msg, time: Date.now() });
        input.value = '';
    };

    onChildAdded(chatRef, (data) => {
        const chat = data.val();
        const chatMessages = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        const isMe = chat.nick === myNick;
        const nickColor = isMe ? "var(--accent)" : "#555";
        div.innerHTML = `<span style="color:${nickColor}; font-weight:700;">[${chat.nick}]</span> ${chat.msg}`;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });
</script>

<script>
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwsaZ9xNvPdZENLmjS-V0sWy22ItvR43YAr3b1K2qTkHrfjUgSedbqnAVpQ2hdc040T/exec";
    let currentSheet = 'data', cachedData = [], isAdmin = false, tempWebP = "";
    let builderData = JSON.parse(localStorage.getItem('plaveBuilder') || '[]');

    function toggleRegPanel() {
        const panel = document.getElementById('registrationPanel');
        const btn = document.getElementById('fabBtn');
        const isVisible = panel.style.display === 'block';
        panel.style.display = isVisible ? 'none' : 'block';
        btn.classList.toggle('active', !isVisible);
    }

    document.getElementById('regLink').addEventListener('change', function() {
        const titleInput = document.getElementById('regTitle');
        if (this.value && titleInput.value === "") titleInput.value = "정보를 자동으로 불러옵니다...";
    });

    async function submitData() {
        const btn = document.getElementById('subBtn');
        const payload = {
            sheetName: document.getElementById('sheetSelect').value,
            url: document.getElementById('regLink').value,
            userTitle: document.getElementById('regTitle').value,
            deadline: document.getElementById('regDeadline').value,
            file: tempWebP ? { base64: tempWebP, type: 'image/webp', name: 'upload' } : null
        };
        btn.innerText = "제보 중...";
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        if((await res.json()).result === "success") {
            const popup = document.getElementById('thanksPopup');
            popup.style.display = 'block'; setTimeout(() => { popup.style.display = 'none'; }, 3000);
            document.getElementById('regLink').value = ''; document.getElementById('regTitle').value = '';
            toggleRegPanel(); btn.innerText = "등록하기"; fetchData();
        }
    }

    // --- 나머지 핵심 함수들 (fetchData, renderCards, builder 로직 등) ---
    async function fetchData() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${currentSheet}!A2:N?key=${API_KEY}`;
        const r = await fetch(url).then(res => res.json());
        cachedData = r.values || [];
        renderCards();
    }

    function renderCards() {
        const q = document.getElementById('search').value.toLowerCase();
        const g = document.getElementById('grid'); g.innerHTML = '';
        const displayData = isAdmin ? cachedData : [...cachedData].reverse();
        displayData.forEach((row, idx) => {
            const [date, link, cat, tag, title, start, deadline, img] = row;
            if(q && !title.toLowerCase().includes(q)) return;
            const c = document.createElement('div');
            c.className = `card`;
            c.innerHTML = `${isAdmin?'<div class="handle">⠿</div>':''}${img ? `<img src="${img}" class="card-img" onclick="showImg('${img}')">` : ''}<div class="card-title">${title}</div><div class="btn-row"><button class="go-btn" onclick="openPlayer('${link}')">이동</button></div>`;
            g.appendChild(c);
        });
    }

    async function loadNotice() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/notice!A:A?key=${API_KEY}`;
        const r = await fetch(url).then(res => res.json());
        const notices = r.values || [];
        document.getElementById('noticeDisplay').innerHTML = notices.map(n => `• ${n[0]}<br>`).join('');
    }

// 1. 퀵 메뉴 로드 시 유튜브 링크만 필터링 (공백 및 타 링크 제외)
    async function loadQuickMenuFromRadio() {
        const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/radio!A2:N?key=${API_KEY}`;
        try {
            const r = await fetch(url).then(res => res.json());
            const radioData = r.values || [];
            const btnContainer = document.getElementById('quickBtns'); 
            btnContainer.innerHTML = ''; 

            radioData.forEach(row => {
                const title = row[4]; // 제목
                const link = row[10]; // 링크 열 (라디오 시트 기준 11번째 열)

                // 링크가 존재하고, 공백이 아니며, 유튜브 주소를 포함하고 있을 때만 버튼 생성
                if (link && link.trim() !== "" && link.includes('youtu')) {
                    const btn = document.createElement('button'); 
                    btn.className = 'chip'; 
                    btn.innerHTML = `🔥 ${title}`;
                    
                    // 첫 번째로 발견되는 유튜브 링크 추출 (공백이나 쉼표로 구분된 경우 대비)
                    const validLink = link.split(/[\s,]+/).find(l => l.includes('youtu'));
                    
                    btn.onclick = () => quickAdd(title, validLink);
                    btnContainer.appendChild(btn);
                }
            });
        } catch (e) { 
            console.error("퀵 메뉴 로드 실패:", e); 
        }
    }

    // 2. 빌더 추가 시 유효성 검사 강화
    function quickAdd(title, url) {
        // 주소가 없거나 공백이거나 유튜브 링크가 아니면 실행 안 함
        if (!url || url.trim() === "" || !url.includes('youtu')) {
            alert("유튜브 링크가 포함되지 않은 항목입니다.");
            return;
        }
        
        // 정상적인 경우에만 빌더 데이터에 추가
        builderData.push({ 
            title: title, 
            url: url.trim(), 
            min: 3, 
            sec: 30, 
            id: Date.now() 
        });
        saveAndRender();
    }
    
    function saveAndRender() {
        localStorage.setItem('plaveBuilder', JSON.stringify(builderData));
        const grid = document.getElementById('builderGrid'); grid.innerHTML = '';
        builderData.forEach((item, index) => {
            const div = document.createElement('div'); div.className = 'builder-item'; div.setAttribute('data-id', item.id);
            div.innerHTML = `<div class="v-drag-handle" style="cursor:grab;">⠿</div><div style="flex:1; font-size:11px;"><b>${item.title}</b></div><button onclick="removeFromBuilder(${index})" style="border:none; background:none; color:red;">×</button>`;
            grid.appendChild(div);
        });
    }

    function askAdmin() { if(prompt("비번?")==="0312") { isAdmin=true; document.querySelectorAll('.admin-only').forEach(e=>e.style.display='block'); renderCards(); } }
    function openPlayer(url) { window.open(url, "_blank"); }
    function setCat(b, s) { document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); b.classList.add('active'); currentSheet=s; fetchData(); }
    function updateFileName(input) { document.getElementById('fileNameDisplay').innerText = input.files[0]?.name || "선택된 파일 없음"; processWebP(input); }
    function removeFromBuilder(idx) { builderData.splice(idx,1); saveAndRender(); }
    function clearBuilder() { if(confirm("비울까요?")) { builderData=[]; saveAndRender(); } }
    async function processWebP(input) {
        if(!input.files[0]) return;
        const file = input.files[0]; const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => { canvas.width = 400; canvas.height = (400/img.width)*img.height; ctx.drawImage(img, 0, 0, 400, canvas.height); tempWebP = canvas.toDataURL('image/webp', 0.5).split(',')[1]; };
    }

    window.onload = () => { fetchData(); loadNotice(); loadQuickMenuFromRadio(); saveAndRender(); };
    Sortable.create(document.getElementById('grid'), {handle: '.handle', animation: 200});
</script>
</body>
</html>
