<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLLI-TUB-RA | 플리정보공간</title>    
    <script src="env-config.js"></script> 
    <script src="config.js"></script>
    <script>
        const API_KEY = window.API_KEY_ENV || CONFIG.API_KEY;
        const SHEET_ID = CONFIG.SPREADSHEET_ID;
        const GAS_URL = CONFIG.GAS_URL;
        const firebaseConfig = CONFIG.FIREBASE;
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { 
            --top: #1a1a2e; --btm: #16213e; --text: #ffffff; 
            --neon-purple: #a29bfe; --accent: #ff7675;
        }
        body { 
            font-family: 'Pretendard', sans-serif; background: radial-gradient(circle at top right, #2d1b4e, #1a1a2e); 
            margin: 0; padding: 15px; min-height: 100vh; color: var(--text); background-attachment: fixed; overflow-x: hidden;
        }
        .container { width: 100%; max-width: 480px; margin: 0 auto; padding-bottom: 100px; }
        header { text-align: center; padding: 40px 0 30px; }
        .logo { font-size: 32px; font-weight: 900; letter-spacing: -1px; text-shadow: 0 0 15px var(--neon-purple); cursor: pointer; }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; padding: 20px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.15);
        }
        #registrationPanel { 
            display: none; position: fixed; z-index: 10000; bottom: 90px; right: 15px; left: 15px; 
            max-width: 420px; margin: auto; animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .input-box { 
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; box-sizing: border-box; font-family: inherit;
        }
        .member-selector { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
        .m-btn { 
            padding: 6px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); color: white; transition: 0.2s;
        }
        .m-btn.active { border-color: white; font-weight: 800; background: rgba(255,255,255,0.3); box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .card { 
            background: rgba(255, 255, 255, 0.05); border-radius: 20px; padding: 15px; border: 1px solid rgba(255, 255, 255, 0.1); position: relative;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.08); border-color: var(--neon-purple); }
        .card-img { width: 100%; height: 90px; border-radius: 12px; object-fit: cover; margin-bottom: 10px; }
        .card-title { font-size: 13px; font-weight: 700; height: 32px; overflow: hidden; margin-bottom: 10px; line-height: 1.3; }
        .member-heart { position: absolute; top: 10px; left: 10px; font-size: 16px; text-shadow: 0 0 5px rgba(0,0,0,0.5); z-index: 2; }
        .tip-badge { 
            position: absolute; top: 10px; right: 10px; background: var(--neon-purple); color: #2d1b4e; 
            padding: 2px 6px; border-radius: 6px; font-size: 10px; font-weight: 900; z-index: 2; cursor: pointer;
            box-shadow: 0 0 10px var(--neon-purple);
        }
        .go-btn { 
            width: 100%; background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: white; border: none; 
            padding: 10px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .chip { padding: 8px 18px; border-radius: 50px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .chip.active { background: white; color: #2d1b4e; box-shadow: 0 0 15px white; }
        .fab-btn { position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; background: white; color: #2d1b4e; border-radius: 50%; font-size: 30px; border: none; z-index: 10001; box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        
        @media (min-width: 1024px) {
            .container { max-width: 1200px; }
            #mainLayout { display: flex; gap: 30px; }
            .sidebar { width: 320px; position: sticky; top: 20px; height: fit-content; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        }
    </style>
</head>
<body>
<div class="container">
    <header onclick="askAdmin()"><div class="logo">PLLI-TUB-RA</div></header>

    <div id="registrationPanel" class="glass-panel">
        <div style="font-weight: 900; margin-bottom: 15px; display: flex; justify-content: space-between;">
            <span style="color:var(--neon-purple)">🗳️ 정보 제보</span>
            <span onclick="toggleRegPanel()" style="cursor:pointer; opacity:0.5;">✕</span>
        </div>
        <select id="regTargetSheet" class="input-box" onchange="toggleRegFields()">
            <option value="data">🌟 투표 및 일반정보</option>
            <option value="tips">💡 투표 팁</option>
        </select>

        <div style="display: flex; gap: 5px; margin-bottom: 15px;">
            <button id="modeLink" onclick="setRegMode('link')" class="m-btn active" style="flex:1">🔗 링크 자동</button>
            <button id="modeText" onclick="setRegMode('text')" class="m-btn" style="flex:1">📝 직접 입력</button>
        </div>
        
        <div id="memberArea">
            <div style="font-size:12px; margin-bottom:5px; opacity:0.7;">주인공 멤버 선택</div>
            <div class="member-selector" id="memberSelector">
                <div class="m-btn" onclick="selectMember(this, '💙')">플레이브</div>
                <div class="m-btn" onclick="selectMember(this, '💙')">예준</div>
                <div class="m-btn" onclick="selectMember(this, '💜')">노아</div>
                <div class="m-btn" onclick="selectMember(this, '💗')">밤비</div>
                <div class="m-btn" onclick="selectMember(this, '❤️')">은호</div>
                <div class="m-btn" onclick="selectMember(this, '🖤')">하민</div>
                <div class="m-btn" onclick="selectMember(this, '🌟')">전체</div>
            </div>
        </div>

        <select id="regVoteApp" class="input-box">
            <option value="">투표 앱 선택</option>
            <option value="주간인기상">주간인기상</option><option value="최애돌">최애돌</option><option value="하이어">하이어</option>
            <option value="딩고">딩고</option><option value="스타트렌드">스타트렌드</option><option value="링크/tin">링크/tin</option>
            <option value="마이원픽">마이원픽</option><option value="뮤니버스">뮤니버스</option><option value="뮤빗">뮤빗</option>
            <option value="벅스">벅스</option><option value="후즈팬">후즈팬</option><option value="팬앤스타">팬앤스타</option>
            <option value="팬캐스트">팬캐스트</option><option value="팬플러스">팬플러스</option><option value="포도알">포도알</option>
            <option value="피크닠">피크닠</option><option value="아이도키">아이도키</option><option value="아이돌챔프">아이돌챔프</option>
            <option value="아이돌픽">아이돌픽</option><option value="유센">유센</option><option value="유픽">유픽</option><option value="셀럽챔프">셀럽챔프</option>
        </select>

        <div id="linkFieldArea">
            <input type="text" id="regLink" class="input-box" placeholder="🔗 링크 주소 (필수)">
        </div>
        
        <input type="text" id="regTitle" class="input-box" placeholder="📝 제목 (미입력 시 자동추출)">
        
        <div id="textFieldArea" style="display:none;">
            <input type="text" id="regImg" class="input-box" placeholder="🖼️ 이미지 주소 (선택사항)">
        </div>

        <div id="dateInputArea" style="display: flex; gap: 8px;">
            <input type="datetime-local" id="regStart" class="input-box" style="font-size:11px">
            <input type="datetime-local" id="regDeadline" class="input-box" style="font-size:11px">
        </div>
        <button onclick="submitData()" id="subBtn" class="go-btn" style="padding:15px; margin-top:5px;">등록하기</button>
    </div>

    <input type="text" id="search" class="input-box" placeholder="🔎 검색어를 입력하세요..." oninput="renderCards()" style="background: rgba(255,255,255,0.05); margin-bottom: 25px; border-radius: 50px; padding-left: 20px;">
    
    <div class="cat-group" style="display:flex; gap:10px; overflow-x:auto; padding-bottom:15px; scrollbar-width: none;">
        <div class="chip active" onclick="setCat(this, 'data')">🌟 전체</div>
        <div class="chip" onclick="setCat(this, 'tips')">🗳️ 투표 팁</div>
        <div class="chip" onclick="location.href='./radio/index.html'">📻 라디오</div>
        <div class="chip" onclick="location.href='./hashtag.html'">✨ 해시태그</div>
    </div>

    <div id="mainLayout">
        <div id="gridContainer"><div class="card-grid" id="grid"></div></div>
        <div class="sidebar">
            <div class="glass-panel"><div style="font-weight:900; color:var(--neon-purple); margin-bottom:10px;">📢 NOTICE</div><div id="noticeDisplay"></div></div>
            <div class="glass-panel"><div style="font-weight:900; color:var(--neon-purple); margin-bottom:10px;">🎂 B-DAY</div><div id="birthdayCountdown"></div></div>
            <div class="glass-panel" style="height: 400px; display: flex; flex-direction: column;">
                <div id="chatMessages" style="flex:1; overflow-y:auto; font-size:13px; margin-bottom:10px; background:rgba(0,0,0,0.2); padding:10px; border-radius:12px;"></div>
                <div style="display: flex; gap: 5px;">
                    <input type="text" id="chatInput" class="input-box" style="margin-bottom:0;" placeholder="채팅..." onkeypress="if(event.keyCode==13) window.sendChat()">
                    <button onclick="window.sendChat()" class="go-btn" style="width: 50px;">전송</button>
                </div>
            </div>
        </div>
    </div>
</div>
<button class="fab-btn" onclick="toggleRegPanel()">+</button>

<script>
    let cachedData = [], tipsOnly = [], currentSheet = 'data', selectedMemberHeart = '', regMode = 'link';

    function setRegMode(mode) {
        regMode = mode;
        document.getElementById('modeLink').classList.toggle('active', mode === 'link');
        document.getElementById('modeText').classList.toggle('active', mode === 'text');
        document.getElementById('linkFieldArea').style.display = mode === 'link' ? 'block' : 'none';
        document.getElementById('textFieldArea').style.display = mode === 'text' ? 'block' : 'none';
        document.getElementById('regTitle').placeholder = mode === 'link' ? "📝 제목 (비워두면 자동추출)" : "📝 등록할 내용 또는 제목";
    }

    function selectMember(btn, heart) {
        document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedMemberHeart = heart;
    }

    async function fetchData() {
        try {
            const tr = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/tips!A2:N?key=${API_KEY}`).then(res => res.json());
            tipsOnly = tr.values || [];
            const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${currentSheet}!A2:N?key=${API_KEY}`).then(res => res.json());
            cachedData = r.values || [];
            renderCards();
        } catch(e) { console.error("데이터 로드 실패"); }
    }

    function renderCards() {
        const q = document.getElementById('search').value.toLowerCase();
        const g = document.getElementById('grid'); g.innerHTML = '';
        const displayData = [...cachedData].reverse();
        displayData.forEach(row => {
            const [date, link, memberHeart, appName, title, start, deadline, img] = row;
            if(q && !title.toLowerCase().includes(q)) return;
            if(currentSheet === 'tips' && (!link || !title)) return;

            const div = document.createElement('div');
            div.className = 'card';
            const hColor = memberHeart === '💙' ? '#3498db' : memberHeart === '💜' ? '#9b59b6' : memberHeart === '💗' ? '#ff7495' : memberHeart === '❤️' ? '#e74c3c' : memberHeart === '🖤' ? '#2d3436' : '#fff';
            const hasTip = tipsOnly.some(t => t[3] === appName && t[1]);
            const tipBadge = (currentSheet === 'data' && hasTip) ? `<div class="tip-badge" onclick="event.stopPropagation(); setCat(null, 'tips')">💡 팁</div>` : "";

            div.innerHTML = `
                <div class="member-heart" style="color:${hColor}">${memberHeart || ''}</div>
                ${tipBadge}
                ${img ? `<img src="${img}" class="card-img" onerror="this.src='https://via.placeholder.com/150?text=PLLI'">` : `<div class="card-img" style="background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center;">🌟</div>`}
                <div class="card-title">${title}</div>
                <button class="go-btn" onclick="${link ? `window.open('${link}', '_blank')` : `alert('등록된 링크가 없습니다.')`}">${currentSheet === 'tips' ? '팁 보기' : '이동하기'}</button>
            `;
            g.appendChild(div);
        });
    }

    async function submitData() {
        const btn = document.getElementById('subBtn');
        const url = document.getElementById('regLink').value.trim();
        const title = document.getElementById('regTitle').value.trim();
        
        if(regMode === 'link' && !url) return alert("링크를 입력해주세요!");
        if(regMode === 'text' && !title) return alert("내용(제목)을 입력해주세요!");
        
        btn.innerText = "처리 중..."; btn.disabled = true;
        const payload = { 
            sheetName: document.getElementById('regTargetSheet').value,
            url: regMode === 'link' ? url : "",
            member: selectedMemberHeart,
            userTitle: title,
            tag: document.getElementById('regVoteApp').value,
            img: regMode === 'text' ? document.getElementById('regImg').value.trim() : "",
            start: document.getElementById('regStart').value,
            deadline: document.getElementById('regDeadline').value
        };

        try {
            await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
            alert("제보 완료! 💜"); toggleRegPanel(); fetchData();
        } catch(e) { alert("오류 발생"); } finally { btn.innerText = "등록하기"; btn.disabled = false; }
    }

    function toggleRegPanel() { const p = document.getElementById('registrationPanel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; }
    function toggleRegFields() { document.getElementById('memberArea').style.display = document.getElementById('regTargetSheet').value === 'tips' ? 'none' : 'block'; }
    function setCat(chip, s) { 
        if(chip) { document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); chip.classList.add('active'); }
        else { document.querySelectorAll('.chip').forEach(c => { if(c.innerText.includes('팁')) c.classList.add('active'); else c.classList.remove('active'); }); }
        currentSheet = s || 'tips'; fetchData(); 
    }
    window.onload = () => { fetchData(); };
</script>
</body>
</html>
