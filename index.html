<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PLLI-TUB-RA | 플리정보공간</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        :root { --top: #c5c9f4; --btm: #fbc2eb; --glass: rgba(255,255,255,0.4); --text: #4b4b7c; --accent: #7d93eb; }
        body { font-family: 'Pretendard', sans-serif; background: linear-gradient(135deg, var(--top), var(--btm)); margin: 0; padding: 20px; min-height: 100vh; color: var(--text); background-attachment: fixed; }
        
        /* 스크롤바 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .container { width: 100%; max-width: 480px; margin: 0 auto; transition: 0.3s; }
        header { text-align: center; padding: 20px 0; cursor: pointer; }
        .logo { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border-radius: 25px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.3); }
        .input-box { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid var(--glass); background: white; outline: none; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 14px; }
        
        .cat-group { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; }
        .chip { padding: 8px 18px; border-radius: 20px; background: rgba(255,255,255,0.2); border: 1px solid var(--glass); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .chip.active { background: white; color: var(--accent); }

        /* 카드 스타일 */
        .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: rgba(255,255,255,0.5); backdrop-filter: blur(10px); border-radius: 22px; padding: 12px; border: 1px solid var(--glass); display: flex; flex-direction: column; transition: 0.3s; position: relative; }
        .card-img { width: 100%; height: 95px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; cursor: pointer; }
        .card-title { font-size: 13px; font-weight: 800; height: 34px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 8px; }
        .go-btn { width: 100%; background: white; color: var(--text); border: none; padding: 10px; border-radius: 12px; font-size: 11px; font-weight: 800; cursor: pointer; }

        /* 투표 팁 카드 스타일 */
        .card.tip-card { border: 2.5px solid var(--accent) !important; background: rgba(255, 255, 255, 0.8) !important; box-shadow: 0 10px 20px rgba(125, 147, 235, 0.2); }
        .card.tip-card .card-title { color: var(--accent); }
        .card.tip-card .go-btn { background: var(--accent); color: white; }

        /* 팁 연동 배지 */
        .tip-link-badge { position: absolute; top: 10px; right: 10px; background: rgba(125, 147, 235, 0.9); color: white; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
/* ✨ 투표 팁 카드 슬림 & 컴팩트 스타일 */
.card.tip-card {
    border: 1.5px solid var(--accent) !important;
    background: rgba(255, 255, 255, 0.9) !important;
    box-shadow: 0 4px 10px rgba(125, 147, 235, 0.1);
    padding: 10px !important; /* 안쪽 여백 줄임 */
    min-height: auto !important; /* 높이 고정 해제 */
}

/* 팁 카드에서는 이미지를 아주 작게 하거나 가로형으로 배치 */
.card.tip-card .card-img {
    height: 60px !important; /* 이미지 높이 확 줄임 */
    margin-bottom: 5px;
}

.card.tip-card .card-title {
    font-size: 12px !important;
    height: auto !important; /* 제목 높이 제한 해제 */
    -webkit-line-clamp: 1 !important; /* 제목을 한 줄만 표시 */
    margin-bottom: 5px;
    text-align: center;
}

.card.tip-card .go-btn {
    padding: 6px !important; /* 버튼도 슬림하게 */
    font-size: 10px !important;
    border-radius: 8px !important;
}
        /* 플로팅 제보 패널 */
        #registrationPanel { display: none; position: fixed; z-index: 10000; bottom: 100px; right: 25px; width: 350px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .fab-btn { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: var(--accent); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 35px; cursor: pointer; box-shadow: 0 8px 20px rgba(125,147,235,0.5); z-index: 10001; transition: 0.3s; border: none; }
        .fab-btn.active { background: #ff7675; transform: rotate(45deg); }

        /* 뮤밍 편집 모달 */
        #builderModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 15000; }
        .builder-content { background: white; width: 90%; max-width: 800px; height: 85vh; border-radius: 30px; padding: 25px; overflow-y: auto; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .gallery-item { background: #f8f9fa; border-radius: 15px; padding: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .gallery-item:hover { border-color: var(--accent); background: #f0f2ff; }
        .gallery-item img { width: 100%; border-radius: 10px; margin-bottom: 8px; }
        .gallery-title { font-size: 11px; font-weight: 700; color: #444; height: 32px; overflow: hidden; }
        .direct-reg { background: var(--top); border-radius: 20px; padding: 15px; margin-bottom: 10px; display: flex; gap: 10px; align-items: end; }

        /* PC 레이아웃 */
        @media (min-width: 1024px) {
            .container { max-width: 1300px; }
            #mainLayout { display: flex; gap: 25px; align-items: start; }
            #gridContainer { flex: 1; }
            .sidebar { width: 320px; min-width: 320px; position: sticky; top: 20px; display: flex; flex-direction: column; gap: 20px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
            #builderGrid { display: flex !important; flex-direction: column !important; }
        }
        .builder-item { background: white; padding: 10px; border-radius: 12px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--glass); margin-bottom: 8px; }
        .thanks-popup { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: white; padding: 12px 25px; border-radius: 50px; font-weight: 900; z-index: 5000; display: none; }
        #modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:none; justify-content:center; align-items:center; z-index:4000; }
        #modal img { max-width: 90%; max-height: 80%; border-radius: 15px; }
    </style>
</head>
<body>

            <option value="팬플러스">팬플러스</option>

        <input type="text" id="regLink" class="input-box" placeholder="🔗 링크 주소">

        <div style="display: flex; gap: 5px;">
            <div style="flex:1;"><label style="font-size:11px; font-weight:800;">시작일</label><input type="datetime-local" id="regStart" class="input-box"></div>
            <div style="flex:1;"><label style="font-size:11px; font-weight:800;">마감일</label><input type="datetime-local" id="regDeadline" class="input-box"></div>

        <button onclick="submitData()" id="subBtn" class="go-btn" style="background:var(--accent); color:white; padding:15px; border-radius:15px;">등록하기</button>
    </div>

    <input type="text" id="search" class="input-box" placeholder="검색어를 입력하세요..." oninput="renderCards()">
    <div class="cat-group">
        <div class="chip active" onclick="setCat(this, 'data')">🌟 전체</div>

                </div>
                <div id="chatMessages" style="flex:1; overflow-y:auto; background:rgba(255,255,255,0.3); border-radius:15px; padding:10px; font-size:12px; margin-bottom:10px;"></div>
                <div style="display: flex; gap: 5px;">

</div>

<div id="builderModal">
    <div class="builder-content">

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyDZQL2iDN220bBdU0xiYDShqLRRp6AQJDI", authDomain: "chat-9035a.firebaseapp.com", databaseURL: "https://chat-9035a-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "chat-9035a", storageBucket: "chat-9035a.firebasestorage.app", messagingSenderId: "807179401789", appId: "1:807179401789:web:644359473a0cb1e05f4854", measurementId: "G-BKQNKVRB8X" };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const chatRef = ref(db, 'chats');
    let myNick = localStorage.getItem('chatNickname') || "플리_" + Math.floor(Math.random()*1000);
    localStorage.setItem('chatNickname', myNick);
    window.sendChat = function() {
        const input = document.getElementById('chatInput');
        if (input.value.trim()) { push(chatRef, { nick: myNick, msg: input.value, time: Date.now() }); input.value = ''; }
    };
    onChildAdded(chatRef, (d) => {
        const c = d.val();
        const box = document.getElementById('chatMessages');
        const div = document.createElement('div');
        div.style.marginBottom = "8px";
        div.innerHTML = `<span style="color:${c.nick===myNick?'var(--accent)':'#555'}; font-weight:700;">[${c.nick}]</span> ${c.msg}`;
        box.appendChild(div); box.scrollTop = box.scrollHeight;
    });
</script>

<script>
    const API_KEY = "AIzaSyDNuBRMC2vXLNaGnDJ4qqq__-z7_WsFZv8";
    const SHEET_ID = "1O4M_r_ZMNFOCRPlIuqMpgfwRtdUSAwY520lyrBX104Y";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwsaZ9xNvPdZENLmjS-V0sWy22ItvR43YAr3b1K2qTkHrfjUgSedbqnAVpQ2hdc040T/exec";
    let cachedData = [], builderData = JSON.parse(localStorage.getItem('plaveBuilder') || '[]');
    let galleryData = [], tipsData = [], currentSheet = 'data', isAdmin = false;

    function toggleRegPanel() {
        const p = document.getElementById('registrationPanel');
        const b = document.getElementById('fabBtn');
        const v = p.style.display === 'block';
        if (!v) {
            const now = new Date();
            const after3 = new Date(); after3.setDate(now.getDate() + 3);
            document.getElementById('regStart').value = now.toISOString().slice(0, 16);
            document.getElementById('regDeadline').value = after3.toISOString().slice(0, 16);
        }
        p.style.display = v ? 'none' : 'block';
        b.classList.toggle('active', !v);
    }

    async function fetchTipsOnly() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/tips!A2:N?key=${API_KEY}`).then(res => res.json());
        tipsData = r.values || [];
    }

    async function fetchData() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${currentSheet}!A2:N?key=${API_KEY}`).then(res => res.json());
        cachedData = r.values || [];
        renderCards();
    }

    function renderCards() {
        const q = document.getElementById('search').value.toLowerCase();
        const g = document.getElementById('grid'); g.innerHTML = '';
        const displayData = isAdmin ? cachedData : [...cachedData].reverse();
        displayData.forEach((row) => {
            const [date, link, cat, appName, title, start, deadline, img] = row;
            if(q && !title.toLowerCase().includes(q)) return;
            const div = document.createElement('div');
            const isTip = currentSheet === 'tips';
            div.className = `card ${isTip ? 'tip-card' : ''}`;
            let tipBadge = "";
            if (!isTip && appName && tipsData.find(t => t[4] === appName)) {
                tipBadge = `<div class="tip-link-badge" onclick="event.stopPropagation(); setCat(null, 'tips')">💡 팁 보기</div>`;
            }
            div.innerHTML = `${tipBadge}${isAdmin?'<div class="handle">⠿</div>':''}${img?`<img src="${img}" class="card-img" onclick="showImg('${img}')">`:''}<div class="card-title">${title}</div><button class="go-btn" onclick="window.open('${link}','_blank')">${isTip?'가이드 보기':'이동'}</button>`;
            g.appendChild(div);
        });
    }

    function setCat(b, s) { 
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        if(b) b.classList.add('active'); 
        else document.querySelector(`.chip[onclick*="'${s}'"]`).classList.add('active');
        currentSheet = s; fetchData(); 
    }

    function saveAndRender() {
        localStorage.setItem('plaveBuilder', JSON.stringify(builderData));
        const grid = document.getElementById('builderGrid'); grid.innerHTML = '';
        builderData.forEach((item, idx) => {
            const div = document.createElement('div'); div.className = 'builder-item';
            div.innerHTML = `<div class="v-drag-handle">⠿</div><div style="flex:1; cursor:pointer;" onclick="playSingleTrack('${item.url}')"><div style="font-weight:800;">${item.title}</div><div style="font-size:10px; color:var(--accent);">🎧 클릭시 덮어씌워 재생</div></div><button onclick="removeFromBuilder(${idx})" style="border:none; background:none; color:red;">×</button>`;
            grid.appendChild(div);
        });
        document.getElementById('totalTimeDisplay').innerText = `총 ${Math.floor(builderData.length*210/60)}분 ${builderData.length*210%60}초`;
    }

    function playSingleTrack(url) { window.open(url, "plavePlayer", "width=1000,height=700"); }
    function playBuilderList() {
        const ids = builderData.map(i => {
            const m = i.url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|\/v\/|embed\/))([^?&"'>]+)/);
            return m ? m[1] : null;
        }).filter(id => id);
        if(ids.length) window.open(`https://www.youtube.com/watch_videos?video_ids=${ids.join(',')}`, "plavePlayer", "width=1000,height=700");
    }

    async function renderGallery() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/radio!A2:N?key=${API_KEY}`).then(res => res.json());
        galleryData = r.values || []; displayGallery(galleryData);
    }
    function displayGallery(data) {
        const grid = document.getElementById('galleryGrid'); grid.innerHTML = '';
        const valid = data.filter(row => row[10] && row[10].includes('youtu'));
        if(!valid.length) { grid.innerHTML=`<div style="grid-column:1/-1; text-align:center; padding:40px; opacity:0.5;">결과가 없어요 🥲</div>`; return; }
        valid.forEach(row => {
            const vid = row[10].split('/').pop().split('=').pop();
            const d = document.createElement('div'); d.className = 'gallery-item';
            d.onclick = () => { builderData.push({title:row[4], url:row[10], id:Date.now()}); saveAndRender(); };
            d.innerHTML = `<img src="https://img.youtube.com/vi/${vid}/mqdefault.jpg" onerror="this.src='https://via.placeholder.com/140x80'"><div class="gallery-title">${row[4]}</div>`;
            grid.appendChild(d);
        });
    }
    function filterGallery() {
        const kw = document.getElementById('gallerySearch').value.toLowerCase();
        displayGallery(galleryData.filter(row => (row[4] || "").toLowerCase().includes(kw)));
    }
    async function fetchYoutubeTitle() {
        const url = document.getElementById('directLink').value.trim();
        const titleInput = document.getElementById('directTitle');
        if (!url.includes('youtu')) return;
        titleInput.placeholder = "⌛ 가져오는 중...";
        try {
            const res = await fetch(`https://noembed.com/embed?url=${url}`);
            const data = await response.json();
            if (data.title) titleInput.value = data.title;
        } catch (e) { titleInput.placeholder = "제목 입력"; }
    }
    function addDirect() {
        const l = document.getElementById('directLink').value.trim(), t = document.getElementById('directTitle').value.trim();
        if (l && l.includes('youtu')) {
            builderData.push({title: t || "유튜브 영상", url: l, id: Date.now()});
            saveAndRender(); document.getElementById('directLink').value = ''; document.getElementById('directTitle').value = ''; alert('리스트에 담겼습니다!');
        } else alert('유튜브 링크를 확인해주세요.');
    }
    async function submitData() {
        const payload = { sheetName: "data", url: document.getElementById('regLink').value, userTitle: document.getElementById('regTitle').value, tag: document.getElementById('regVoteApp').value, start: document.getElementById('regStart').value, deadline: document.getElementById('regDeadline').value };
        const res = await fetch(GAS_URL, { method: "POST", body: JSON.stringify(payload) });
        if((await res.json()).result === "success") { 
            const p = document.getElementById('thanksPopup'); p.style.display='block'; setTimeout(()=>p.style.display='none', 2000);
            toggleRegPanel(); fetchData(); 
        }
    }
    function openBuilderModal() { document.getElementById('builderModal').style.display='flex'; renderGallery(); }
    function closeBuilderModal() { document.getElementById('builderModal').style.display='none'; }
    function removeFromBuilder(i) { builderData.splice(i,1); saveAndRender(); }
    function clearBuilder() { if(confirm("비울까요?")) { builderData=[]; saveAndRender(); } }
    function showImg(s) { document.getElementById('modalImg').src = s; document.getElementById('modal').style.display='flex'; }
    function askAdmin() { if(prompt("비번?")==="0312") { isAdmin=true; fetchData(); } }
    async function loadNotice() {
        const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/notice!A:A?key=${API_KEY}`).then(res => res.json());
        document.getElementById('noticeDisplay').innerHTML = (r.values || []).map(n => `• ${n[0]}<br>`).join('');
    }
    window.onload = async () => { await fetchTipsOnly(); fetchData(); loadNotice(); saveAndRender(); };
</script>
</body>
</html>
